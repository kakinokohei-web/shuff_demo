    };

    // --- サブタブ②: 売上分析チャート ---
    const DashboardSalesChart = ({ orders, visits }) => {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const [period, setPeriod] = useState('week');
      const [dowFrom, setDowFrom] = useState('');
      const [dowTo, setDowTo] = useState('');
      const dayNamesList = ['日', '月', '火', '水', '木', '金', '土'];

      // 注文データから日別集計を生成
      const dailyData = useMemo(() => {
        const map = {};
        orders.forEach(o => {
          const d = new Date(o.ordered_at);
          const key = d.toISOString().split('T')[0];
          if (!map[key]) map[key] = { sales: 0, customerIds: new Set() };
          map[key].sales += o.price;
          if (o.customer_id) map[key].customerIds.add(o.customer_id);
        });
        return Object.entries(map)
          .map(([dateStr, v]) => ({ date: new Date(dateStr), dateStr, sales: v.sales, customers: v.customerIds.size }))
          .sort((a, b) => a.date - b.date);
      }, [orders]);

      const getFiltered = useCallback((start, end) => {
        return dailyData.filter(d => d.date >= start && d.date <= end);
      }, [dailyData]);

      const formatLabel = (d, totalDays) => {
        const m = d.date.getMonth() + 1, dt = d.date.getDate();
        const dow = dayNamesList[d.date.getDay()];
        return totalDays <= 14 ? `${m}/${dt}(${dow})` : `${m}/${dt}`;
      };

      const aggregateWeekly = (data) => {
        const weeks = []; let wS = 0, wC = 0, ws = null;
        data.forEach((d, i) => {
          if (!ws) ws = d;
          wS += d.sales; wC += d.customers;
          if (d.date.getDay() === 0 || i === data.length - 1) {
            const m1 = ws.date.getMonth()+1, d1 = ws.date.getDate();
            const m2 = d.date.getMonth()+1, d2 = d.date.getDate();
            weeks.push({ label: `${m1}/${d1}~${m2}/${d2}`, sales: wS, customers: wC });
            wS = 0; wC = 0; ws = null;
          }
        });
        return weeks;
      };

      const prepareChartData = useCallback((start, end) => {
        const filtered = getFiltered(start, end);
        const totalDays = Math.ceil((end - start) / 86400000);
        if (totalDays > 60) {
          const w = aggregateWeekly(filtered);
          return { labels: w.map(x => x.label), sales: w.map(x => x.sales), customers: w.map(x => x.customers), isWeekly: true };
        }
        return { labels: filtered.map(d => formatLabel(d, totalDays)), sales: filtered.map(d => d.sales), customers: filtered.map(d => d.customers), isWeekly: false };
      }, [getFiltered]);

      const prepareDowData = useCallback((start, end) => {
        const filtered = getFiltered(start, end);
        const dowLabels = ['月', '火', '水', '木', '金', '土', '日'];
        const dowMap2 = [6, 0, 1, 2, 3, 4, 5];
        const salesByDow = [0,0,0,0,0,0,0], customersByDow = [0,0,0,0,0,0,0], countByDow = [0,0,0,0,0,0,0];
        filtered.forEach(d => {
          const idx = dowMap2[d.date.getDay()];
          salesByDow[idx] += d.sales; customersByDow[idx] += d.customers; countByDow[idx]++;
        });
        const avgS = salesByDow.map((s, i) => countByDow[i] > 0 ? Math.round(s / countByDow[i]) : 0);
        const avgC = customersByDow.map((c, i) => countByDow[i] > 0 ? Math.round(c / countByDow[i] * 10) / 10 : 0);
        return { labels: dowLabels, sales: avgS, customers: avgC, isWeekly: false, isDow: true };
      }, [getFiltered]);

      const renderChart = useCallback((chartData) => {
        if (!chartRef.current) return;
        if (chartInstance.current) chartInstance.current.destroy();
        const ctx = chartRef.current.getContext('2d');
        const { labels, sales, customers, isWeekly, isDow } = chartData;
        const isCompact = labels.length > 14;

        chartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              {
                label: isDow ? '平均売上' : isWeekly ? '売上（週計）' : '売上',
                data: sales,
                backgroundColor: isDow
                  ? sales.map(v => v === Math.max(...sales) ? 'rgba(239,68,68,0.7)' : 'rgba(59,130,246,0.7)')
                  : isCompact ? 'rgba(59,130,246,0.5)' : 'rgba(59,130,246,0.7)',
                borderColor: isDow
                  ? sales.map(v => v === Math.max(...sales) ? 'rgba(239,68,68,1)' : 'rgba(59,130,246,1)')
                  : 'rgba(59,130,246,1)',
                borderWidth: 1, borderRadius: isDow ? 8 : isCompact ? 2 : 6, yAxisID: 'y', order: 2,
              },
              {
                label: isDow ? '平均来店数' : isWeekly ? '来店数（週計）' : '来店数',
                data: customers, type: 'line',
                borderColor: 'rgba(239,68,68,0.9)', backgroundColor: 'rgba(239,68,68,0.1)',
                borderWidth: 2.5, pointRadius: isDow ? 6 : isCompact ? 1.5 : 5,
                pointBackgroundColor: 'rgba(239,68,68,1)', pointBorderColor: '#fff',
                pointBorderWidth: isDow ? 2 : isCompact ? 1 : 2,
                tension: 0.3, fill: false, yAxisID: 'y1', order: 1,
              }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(0,0,0,0.85)', titleFont: { size: 13 }, bodyFont: { size: 12 },
                padding: 10, cornerRadius: 8,
                callbacks: {
                  label: function(context) {
                    const pf = isDow ? '平均' : '';
                    if (context.datasetIndex === 0) return `${pf}売上: ¥${context.parsed.y.toLocaleString()}`;
                    return `${pf}来店: ${context.parsed.y}組`;
                  }
                }
              }
            },
            scales: {
              x: {
                grid: { display: isDow },
                ticks: { font: { size: isDow ? 13 : isCompact ? 8 : 11, weight: isDow ? 'bold' : 'normal' }, maxRotation: isCompact ? 60 : 0, autoSkip: !isDow, maxTicksLimit: isDow ? 7 : isCompact ? 12 : 31 }
              },
              y: {
                position: 'left', beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' },
                ticks: { font: { size: 10 }, callback: v => v >= 10000 ? `${v/10000}万` : v >= 1000 ? `${(v/1000).toFixed(0)}k` : v }
              },
              y1: {
                position: 'right', beginAtZero: true, grid: { display: false },
                ticks: { font: { size: 10 }, callback: v => v + '組' }
              }
            }
          }
        });
      }, []);

      // サマリー算出
      const summaryData = useMemo(() => {
        const now = new Date();
        let start, end = new Date(now); end.setHours(23,59,59);
        let chartData, isDow = false;

        if (period === 'dow') {
          isDow = true;
          const from = dowFrom ? new Date(dowFrom) : new Date(now.getTime() - 179 * 86400000);
          const to = dowTo ? new Date(dowTo) : new Date(now);
          from.setHours(0,0,0); to.setHours(23,59,59);
          chartData = prepareDowData(from, to);
        } else {
          switch(period) {
            case 'week': start = new Date(now); start.setDate(start.getDate() - 6); break;
            case 'month': start = new Date(now); start.setDate(start.getDate() - 29); break;
            case 'all': start = dailyData.length > 0 ? new Date(dailyData[0].date) : new Date(now); break;
          }
          start.setHours(0,0,0);
          chartData = prepareChartData(start, end);
        }

        if (isDow) {
          const avgSales = Math.round(chartData.sales.reduce((a, b) => a + b, 0) / 7);
          const avgCust = (chartData.customers.reduce((a, b) => a + b, 0) / 7).toFixed(1);
          const bestDay = chartData.labels[chartData.sales.indexOf(Math.max(...chartData.sales))];
          return { s1Label: '平均売上/日', s1: `¥${avgSales.toLocaleString()}`, s2Label: '平均来店/日', s2: `${avgCust}組`, s3Label: '最多曜日', s3: `${bestDay}曜`, chartData };
        } else {
          const totalS = chartData.sales.reduce((a, b) => a + b, 0);
          const totalC = chartData.customers.reduce((a, b) => a + b, 0);
          const avgSpend = totalC > 0 ? Math.round(totalS / totalC) : 0;
          return { s1Label: '売上合計', s1: `¥${totalS.toLocaleString()}`, s2Label: '来店合計', s2: `${totalC}組`, s3Label: '客単価', s3: `¥${avgSpend.toLocaleString()}`, chartData };
        }
      }, [period, dowFrom, dowTo, dailyData, prepareChartData, prepareDowData]);

      useEffect(() => {
        renderChart(summaryData.chartData);
      }, [summaryData, renderChart]);

      // 曜日別デフォルト日付セット
      useEffect(() => {
        if (period === 'dow' && !dowFrom) {
          const now = new Date();
          const from = new Date(now.getTime() - 179 * 86400000);
          setDowFrom(from.toISOString().split('T')[0]);
          setDowTo(now.toISOString().split('T')[0]);
        }
      }, [period]);

      const setDowPreset = (days) => {
        const now = new Date();
        const from = new Date(now); from.setDate(from.getDate() - (days - 1));
        setDowFrom(from.toISOString().split('T')[0]);
        setDowTo(now.toISOString().split('T')[0]);
      };

      return (
        <>
          {/* 期間ボタン */}
          <div className="flex gap-1.5 mb-3">
            {[{id:'week',l:'週計'},{id:'month',l:'月計'},{id:'all',l:'全期間'},{id:'dow',l:'曜日別'}].map(b => (
              <button key={b.id} onClick={() => setPeriod(b.id)}
                className={`flex-1 py-2 rounded-xl font-semibold text-xs transition-all ${period === b.id ? 'bg-blue-500 text-white shadow-sm' : 'bg-gray-100 text-gray-600'}`}>
                {b.l}
              </button>
            ))}
          </div>

          {/* 曜日別: 期間選択 */}
          {period === 'dow' && (
            <div className="bg-white rounded-xl p-3 shadow-sm mb-3">
              <p className="text-[10px] text-gray-500 mb-1.5 font-semibold">集計期間</p>
              <div className="flex items-center gap-2 mb-2">
                <input type="date" value={dowFrom} onChange={e => setDowFrom(e.target.value)} className="flex-1 text-sm border-2 border-gray-200 rounded-lg px-2 py-1" />
                <span className="text-gray-300">→</span>
                <input type="date" value={dowTo} onChange={e => setDowTo(e.target.value)} className="flex-1 text-sm border-2 border-gray-200 rounded-lg px-2 py-1" />
              </div>
              <div className="flex gap-1.5">
                {[{d:30,l:'過去1ヶ月'},{d:90,l:'過去3ヶ月'},{d:180,l:'全期間'}].map(p => (
                  <button key={p.d} onClick={() => setDowPreset(p.d)} className="flex-1 py-1.5 rounded-lg text-[10px] font-semibold bg-gray-100 text-gray-500 active:bg-gray-200">{p.l}</button>
                ))}
              </div>
            </div>
          )}

          {/* サマリーカード */}
          <div className="grid grid-cols-3 gap-2 mb-3">
            <div className="bg-white rounded-xl p-3 shadow-sm">
              <p className="text-[10px] text-gray-500 mb-0.5">{summaryData.s1Label}</p>
              <p className="text-base font-bold text-green-600">{summaryData.s1}</p>
            </div>
            <div className="bg-white rounded-xl p-3 shadow-sm">
              <p className="text-[10px] text-gray-500 mb-0.5">{summaryData.s2Label}</p>
              <p className="text-base font-bold text-blue-600">{summaryData.s2}</p>
            </div>
            <div className="bg-white rounded-xl p-3 shadow-sm">
              <p className="text-[10px] text-gray-500 mb-0.5">{summaryData.s3Label}</p>
              <p className="text-base font-bold text-purple-600">{summaryData.s3}</p>
            </div>
          </div>

          {/* チャート */}
          <div className="bg-white rounded-xl p-4 shadow-sm mb-3">
            <div style={{height: '260px'}}><canvas ref={chartRef}></canvas></div>
          </div>

          {/* 凡例 */}
          <div className="flex justify-center gap-6">
            <div className="flex items-center gap-1.5">
              <span className="w-3 h-3 rounded-sm" style={{background: 'rgba(59,130,246,0.7)'}}></span>
              <span className="text-xs text-gray-600">{period === 'dow' ? '平均売上（¥）' : '売上（¥）'}</span>
            </div>
            <div className="flex items-center gap-1.5">
              <span className="w-3 h-3 rounded-full" style={{background: 'rgba(239,68,68,0.9)'}}></span>
              <span className="text-xs text-gray-600">{period === 'dow' ? '平均来店（組）' : '来店数（組）'}</span>
            </div>
          </div>
        </>
      );
    };

    // --- サブタブ③: 時間帯別ヒートマップ ---
    const DashboardHeatmap = ({ orders }) => {
      const [hmPeriod, setHmPeriod] = useState('1m');
      const [hmFrom, setHmFrom] = useState('');
      const [hmTo, setHmTo] = useState('');
      const dayNamesHm = ['月', '火', '水', '木', '金', '土', '日'];
      const hoursHm = ['18', '19', '20', '21', '22', '23', '0', '1', '2'];
      const hourLabelsHm = ['18:00', '19:00', '20:00', '21:00', '22:00', '23:00', '0:00', '1:00', '2:00'];
      const dowMapHm = [6, 0, 1, 2, 3, 4, 5]; // getDay→月始まり

      // 注文データから日別×時間帯別の来客数を集計
      const hourlyData = useMemo(() => {
        const map = {}; // key: "YYYY-MM-DD" → { dow, hours: { '18': Set, '19': Set, ... } }
        orders.forEach(o => {
          const d = new Date(o.ordered_at);
          const h = d.getHours();
          // 営業時間: 18-翌2時。2時以前は前日扱い
          let dateKey;
          if (h < 6) {
            const prev = new Date(d); prev.setDate(prev.getDate() - 1);
            dateKey = prev.toISOString().split('T')[0];
          } else {
            dateKey = d.toISOString().split('T')[0];
          }
          const hourKey = String(h);
          if (!hoursHm.includes(hourKey)) return; // 営業時間外を除外

          if (!map[dateKey]) {
            const dt = new Date(dateKey);
            map[dateKey] = { date: dt, dow: dowMapHm[dt.getDay()], hours: {} };
            hoursHm.forEach(hh => { map[dateKey].hours[hh] = new Set(); });
          }
          if (o.customer_id) map[dateKey].hours[hourKey].add(o.customer_id);
        });
        return Object.values(map).sort((a, b) => a.date - b.date);
      }, [orders]);

      // 期間フィルタ → 曜日×時間帯の平均
      const heatmapResult = useMemo(() => {
        const now = new Date();
        let start, end = new Date(now); end.setHours(23,59,59);

        if (hmPeriod === 'custom') {
          if (!hmFrom || !hmTo) return null;
          start = new Date(hmFrom); start.setHours(0,0,0);
          end = new Date(hmTo); end.setHours(23,59,59);
        } else {
          switch(hmPeriod) {
            case '1m': start = new Date(now); start.setDate(start.getDate() - 29); break;
            case '3m': start = new Date(now); start.setDate(start.getDate() - 89); break;
            case 'all': start = hourlyData.length > 0 ? new Date(hourlyData[0].date) : new Date(now); break;
          }
          start.setHours(0,0,0);
        }

        const filtered = hourlyData.filter(d => d.date >= start && d.date <= end);
        const countByDow = new Array(7).fill(0);
        const sumByDowHour = {};
        dayNamesHm.forEach((_, di) => {
          sumByDowHour[di] = {};
          hoursHm.forEach(h => { sumByDowHour[di][h] = 0; });
        });

        filtered.forEach(d => {
          countByDow[d.dow]++;
          hoursHm.forEach(h => {
            sumByDowHour[d.dow][h] += d.hours[h] ? d.hours[h].size : 0;
          });
        });

        const avgData = {};
        dayNamesHm.forEach((day, di) => {
          avgData[day] = {};
          hoursHm.forEach(h => {
            avgData[day][h] = countByDow[di] > 0 ? Math.round(sumByDowHour[di][h] / countByDow[di] * 10) / 10 : 0;
          });
        });

        // ピーク・平均算出
        let maxVal = 0, peakDay = '', peakHour = '', totalSum = 0, cellCount = 0;
        dayNamesHm.forEach(day => {
          hoursHm.forEach(hour => {
            const v = avgData[day][hour];
            if (v > maxVal) { maxVal = v; peakDay = day; peakHour = hour; }
            totalSum += v; cellCount++;
          });
        });
        const overallAvg = cellCount > 0 ? (totalSum / cellCount).toFixed(1) : '0';
        const totalWeeks = Math.round(filtered.length / 7);

        return { avgData, maxVal, peakDay, peakHour, overallAvg, totalWeeks };
      }, [hourlyData, hmPeriod, hmFrom, hmTo]);

      const getHmColor = (value, max) => {
        if (max === 0 || value === 0) return '#f0f9ff';
        const ratio = value / max;
        const colors = [{t:0,c:'#f0f9ff'},{t:0.15,c:'#bae6fd'},{t:0.3,c:'#7dd3fc'},{t:0.45,c:'#38bdf8'},{t:0.6,c:'#0ea5e9'},{t:0.75,c:'#0284c7'},{t:0.9,c:'#0369a1'},{t:1.0,c:'#ea580c'}];
        for (let i = colors.length - 1; i >= 0; i--) { if (ratio >= colors[i].t) return colors[i].c; }
        return colors[0].c;
      };

      // 初期化
      useEffect(() => {
        if (hmPeriod === 'custom' && !hmFrom) {
          const now = new Date();
          const from = new Date(now); from.setDate(from.getDate() - 29);
          setHmFrom(from.toISOString().split('T')[0]);
          setHmTo(now.toISOString().split('T')[0]);
        }
      }, [hmPeriod]);

      const setHmPreset = (days) => {
        const now = new Date();
        const from = new Date(now); from.setDate(from.getDate() - (days - 1));
        setHmFrom(from.toISOString().split('T')[0]);
        setHmTo(now.toISOString().split('T')[0]);
      };

      if (!heatmapResult) return <p className="text-center text-gray-400 py-8">データなし</p>;
      const { avgData, maxVal, peakDay, peakHour, overallAvg, totalWeeks } = heatmapResult;

      return (
        <>
          {/* 期間ボタン */}
          <div className="flex gap-1.5 mb-3">
            {[{id:'1m',l:'過去1ヶ月'},{id:'3m',l:'過去3ヶ月'},{id:'all',l:'全期間'},{id:'custom',l:'カスタム'}].map(b => (
              <button key={b.id} onClick={() => setHmPeriod(b.id)}
                className={`flex-1 py-2 rounded-xl font-semibold text-xs transition-all ${hmPeriod === b.id ? 'bg-blue-500 text-white shadow-sm' : 'bg-gray-100 text-gray-600'}`}>
                {b.l}
              </button>
            ))}
          </div>

          {/* カスタム期間ピッカー */}
          {hmPeriod === 'custom' && (
            <div className="bg-white rounded-xl p-3 shadow-sm mb-3">
              <p className="text-[10px] text-gray-500 mb-1.5 font-semibold">集計期間</p>
              <div className="flex items-center gap-2">
                <input type="date" value={hmFrom} onChange={e => setHmFrom(e.target.value)} className="flex-1 text-sm border-2 border-gray-200 rounded-lg px-2 py-1" />
                <span className="text-gray-300">→</span>
                <input type="date" value={hmTo} onChange={e => setHmTo(e.target.value)} className="flex-1 text-sm border-2 border-gray-200 rounded-lg px-2 py-1" />
              </div>
            </div>
          )}

          {/* サマリー */}
          <div className="grid grid-cols-3 gap-2 mb-3">
            <div className="bg-white rounded-xl p-3 shadow-sm">
              <p className="text-[10px] text-gray-500 mb-0.5">ピーク</p>
              <p className="text-base font-bold text-orange-600">{peakDay} {peakHour}:00</p>
            </div>
            <div className="bg-white rounded-xl p-3 shadow-sm">
              <p className="text-[10px] text-gray-500 mb-0.5">平均来店/時間</p>
              <p className="text-base font-bold text-blue-600">{overallAvg}組</p>
            </div>
            <div className="bg-white rounded-xl p-3 shadow-sm">
              <p className="text-[10px] text-gray-500 mb-0.5">集計週数</p>
              <p className="text-base font-bold text-purple-600">{totalWeeks}週</p>
            </div>
          </div>

          {/* ヒートマップ */}
          <div className="bg-white rounded-xl p-3 shadow-sm mb-3">
            <p className="text-sm font-semibold text-gray-700 mb-2">曜日 × 時間帯（平均来店数）</p>
            <div style={{display:'grid', gridTemplateColumns:`28px repeat(${hoursHm.length}, 1fr)`, gap:'3px', alignItems:'center'}}>
              <div></div>
              {hourLabelsHm.map(l => <div key={l} className="text-center text-[9px] text-gray-400 font-medium">{l}</div>)}
              {dayNamesHm.map(day => (
                <React.Fragment key={day}>
                  <div className={`text-xs font-semibold text-right pr-1 ${['金','土','日'].includes(day) ? 'text-orange-600' : 'text-gray-500'}`}>{day}</div>
                  {hoursHm.map(hour => {
                    const v = avgData[day][hour];
                    const color = v === 0 ? '#f8fafc' : getHmColor(v, maxVal);
                    const tc = maxVal > 0 && v / maxVal > 0.6 ? 'white' : (v === 0 ? '#cbd5e1' : '#334155');
                    const disp = Number.isInteger(v) ? v : v.toFixed(1);
                    return (
                      <div key={hour} style={{background:color, height:'34px', display:'flex', alignItems:'center', justifyContent:'center', borderRadius:'4px'}}>
                        <span style={{fontSize:'9px', fontWeight:600, color:tc}}>{disp}</span>
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
          </div>

          {/* 凡例 */}
          <div className="bg-white rounded-xl p-3 shadow-sm mb-3">
            <p className="text-xs text-gray-500 mb-1.5">来店密度</p>
            <div className="flex items-center gap-1">
              <span className="text-[10px] text-gray-400">少</span>
              <div className="flex gap-0.5 flex-1">
                {['#f0f9ff','#bae6fd','#7dd3fc','#38bdf8','#0ea5e9','#0284c7','#0369a1','#ea580c'].map(c => (
                  <div key={c} className="h-3 flex-1 rounded" style={{background:c}}></div>
                ))}
              </div>
              <span className="text-[10px] text-gray-400">多</span>
            </div>
          </div>

          {/* 時間帯別棒グラフ */}
          <div className="bg-white rounded-xl p-3 shadow-sm">
            <p className="text-sm font-semibold text-gray-700 mb-2">時間帯別 平均来店数</p>
            <div className="space-y-1.5">
              {hoursHm.map((hour, i) => {
                let sum = 0;
                dayNamesHm.forEach(day => { sum += avgData[day][hour]; });
                const avg = sum / 7;
                const maxHourly = Math.max(...hoursHm.map(h => {
                  let s = 0; dayNamesHm.forEach(d => { s += avgData[d][h]; }); return s / 7;
                }));
                const width = maxHourly > 0 ? (avg / maxHourly * 100) : 0;
                const isHighest = avg === maxHourly && avg > 0;
                return (
                  <div key={hour} className="flex items-center gap-2">
                    <span className="text-xs text-gray-500 w-11 text-right font-medium">{hourLabelsHm[i]}</span>
                    <div className="flex-1 bg-gray-100 rounded-full h-5 overflow-hidden">
                      <div className="h-full rounded-full flex items-center transition-all"
                        style={{width:`${width}%`, background: isHighest ? '#ea580c' : '#3b82f6'}}>
                        {width > 20 && <span className="text-white text-[10px] font-semibold pl-2">{avg.toFixed(1)}組</span>}
                      </div>
                    </div>
                    {width <= 20 && <span className="text-[10px] text-gray-500 font-medium">{avg.toFixed(1)}</span>}
                  </div>
                );
              })}
            </div>
          </div>
        </>
      );
    };

    // --- 日報コンポーネント ---
    const DashboardReport = ({ orders, visits, customers }) => {
      const [mode, setMode] = useState('day');
      const [currentDate, setCurrentDate] = useState(() => new Date());
      const [periodFrom, setPeriodFrom] = useState(() => {
        const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
      });
      const [periodTo, setPeriodTo] = useState(() => new Date().toISOString().split('T')[0]);
      const [expandedRows, setExpandedRows] = useState(new Set());
      const [expandedPeriodRows, setExpandedPeriodRows] = useState(new Set());

      const daysOfWeek = ['日','月','火','水','木','金','土'];

      const customerMap = useMemo(() => {
        const map = {};
        customers.forEach(c => { map[c.id] = c.name; });
        return map;
      }, [customers]);

      const ordersByVisitId = useMemo(() => {
        const map = {};
        orders.forEach(o => {
          if (!map[o.visit_id]) map[o.visit_id] = [];
          map[o.visit_id].push(o);
        });
        return map;
      }, [orders]);

      // 閉じた来店のみ対象（会計済み）
      const closedVisits = useMemo(() => visits.filter(v => !v.is_active && v.total_spent > 0), [visits]);

      const visitsByDate = useMemo(() => {
        const map = {};
        closedVisits.forEach(v => {
          const dateStr = (v.left_at || v.seated_at || '').split('T')[0];
          if (!dateStr) return;
          if (!map[dateStr]) map[dateStr] = [];
          map[dateStr].push(v);
        });
        return map;
      }, [closedVisits]);

      const getRecordsFromVisits = useCallback((vList) => {
        return vList.map(v => ({
          id: v.id,
          name: customerMap[v.customer_id] || '不明',
          party: v.party_size || 1,
          sales: v.total_spent || 0,
          payment: v.payment_method || '現金',
          receipt: v.receipt || false,
          items: (ordersByVisitId[v.id] || []).map(o => ({
            item: o.item,
            price: o.price,
            type: o.order_type === 'staff_drink' ? 'staff' : 'regular'
          }))
        }));
      }, [customerMap, ordersByVisitId]);

      const calcSummary = (records) => {
        let total=0,cash=0,card=0,qr=0,receipt=0,totalParty=0;
        let cashCount=0,cardCount=0,qrCount=0,receiptCount=0;
        records.forEach(r => {
          total += r.sales; totalParty += r.party;
          const p = r.payment;
          if (p === '現金' || p === 'cash') { cash += r.sales; cashCount++; }
          else if (p === 'カード' || p === 'card') { card += r.sales; cardCount++; }
          else if (p === 'QR' || p === 'qr') { qr += r.sales; qrCount++; }
          if (r.receipt) { receipt += r.sales; receiptCount++; }
        });
        return { total, cash, card, qr, receipt, count: records.length, totalParty, cashCount, cardCount, qrCount, receiptCount };
      };

      const dayViewData = useMemo(() => {
        const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(currentDate.getDate()).padStart(2,'0')}`;
        const dayVisits = visitsByDate[dateStr] || [];
        const records = getRecordsFromVisits(dayVisits);
        return { dateStr, records, summary: calcSummary(records) };
      }, [currentDate, visitsByDate, getRecordsFromVisits]);

      const periodViewData = useMemo(() => {
        const start = new Date(periodFrom); const end = new Date(periodTo);
        if (isNaN(start) || isNaN(end) || start > end) return { dailySummaries: [], totalSummary: calcSummary([]) };
        let allRecords = []; let dailySummaries = [];
        const d = new Date(start);
        while (d <= end) {
          const key = d.toISOString().split('T')[0];
          const dayVisits = visitsByDate[key] || [];
          if (dayVisits.length > 0) {
            const records = getRecordsFromVisits(dayVisits);
            dailySummaries.push({ date: new Date(d), dateKey: key, summary: calcSummary(records), records });
            allRecords = allRecords.concat(records);
          }
          d.setDate(d.getDate() + 1);
        }
        return { dailySummaries, totalSummary: calcSummary(allRecords) };
      }, [periodFrom, periodTo, visitsByDate, getRecordsFromVisits]);

      const getPaymentText = (p) => ({ '現金':'現金', 'カード':'カード', 'QR':'QR', cash:'現金', card:'カード', qr:'QR' }[p] || p || '-');
      const getPaymentClass = (p) => ({ '現金':'text-gray-600', 'カード':'text-blue-600', 'QR':'text-purple-600', cash:'text-gray-600', card:'text-blue-600', qr:'text-purple-600' }[p] || 'text-gray-400');
      const formatDateDisplay = (d) => `${d.getMonth()+1}月${d.getDate()}日（${daysOfWeek[d.getDay()]}）`;

      const toggleDetail = (idx) => {
        setExpandedRows(prev => { const s = new Set(prev); s.has(idx) ? s.delete(idx) : s.add(idx); return s; });
      };
      const togglePeriodDetail = (dateKey, idx) => {
        const key = `${dateKey}-${idx}`;
        setExpandedPeriodRows(prev => { const s = new Set(prev); s.has(key) ? s.delete(key) : s.add(key); return s; });
      };
      const setPeriodPreset = (preset) => {
        const now = new Date();
        let start, end = new Date(now);
        switch(preset) {
          case 'week': start = new Date(now); start.setDate(start.getDate() - start.getDay() + 1); break;
          case 'month': start = new Date(now.getFullYear(), now.getMonth(), 1); break;
          case 'lastmonth': start = new Date(now.getFullYear(), now.getMonth()-1, 1); end = new Date(now.getFullYear(), now.getMonth(), 0); break;
        }
        setPeriodFrom(start.toISOString().split('T')[0]);
        setPeriodTo(end.toISOString().split('T')[0]);
      };

      const renderItems = (items) => {
        if (!items || items.length === 0) return <div className="px-4 py-2 text-xs text-gray-400">注文データなし</div>;
        return (
          <div className="px-4 py-2 space-y-1">
            {items.map((item, idx) => {
              const isStaff = item.type === 'staff';
              return (
                <div key={idx} className={`flex justify-between items-center ${isStaff ? 'text-pink-500' : 'text-gray-600'}`}>
                  <span className={`text-xs ${isStaff ? 'font-medium' : ''}`}>{isStaff ? '🥂 ' : ''}{item.item}</span>
                  <span className="text-xs font-medium">¥{item.price.toLocaleString()}</span>
                </div>
              );
            })}
          </div>
        );
      };

      const summary = mode === 'day' ? dayViewData.summary : periodViewData.totalSummary;

      return (
        <div>
          {/* Mode Toggle */}
          <div className="flex gap-1.5 mb-3">
            <button onClick={() => { setMode('day'); setExpandedRows(new Set()); }} className={`flex-1 py-2 rounded-xl font-semibold text-xs transition-all shadow-sm ${mode === 'day' ? 'bg-blue-500 text-white' : 'bg-white text-gray-600'}`}>日別</button>
            <button onClick={() => { setMode('period'); setExpandedPeriodRows(new Set()); }} className={`flex-1 py-2 rounded-xl font-semibold text-xs transition-all shadow-sm ${mode === 'period' ? 'bg-blue-500 text-white' : 'bg-white text-gray-600'}`}>期間集計</button>
          </div>

          {/* Day Navigation */}
          {mode === 'day' && (
            <div className="flex items-center justify-between bg-white rounded-xl p-3 shadow-sm mb-3">
              <button onClick={() => setCurrentDate(d => { const n = new Date(d); n.setDate(n.getDate()-1); return n; })}
                className="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-lg font-bold text-gray-500 active:bg-gray-200">‹</button>
              <div className="text-center">
                <p className="text-lg font-bold text-gray-800">{currentDate.getMonth()+1}月{currentDate.getDate()}日</p>
                <p className="text-xs text-gray-400">{currentDate.getFullYear()}年 {daysOfWeek[currentDate.getDay()]}曜日</p>
              </div>
              <button onClick={() => setCurrentDate(d => { const n = new Date(d); n.setDate(n.getDate()+1); return n; })}
                className="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-lg font-bold text-gray-500 active:bg-gray-200">›</button>
            </div>
          )}

          {/* Period Navigation */}
          {mode === 'period' && (
            <div className="bg-white rounded-xl p-3 shadow-sm mb-3">
              <p className="text-[10px] text-gray-500 mb-1.5 font-semibold">集計期間</p>
              <div className="flex items-center gap-2 mb-2">
                <input type="date" value={periodFrom} onChange={e => setPeriodFrom(e.target.value)} className="flex-1 text-xs border-2 border-gray-200 rounded-lg px-2 py-1.5 focus:border-blue-500 focus:outline-none" />
                <span className="text-gray-300">→</span>
                <input type="date" value={periodTo} onChange={e => setPeriodTo(e.target.value)} className="flex-1 text-xs border-2 border-gray-200 rounded-lg px-2 py-1.5 focus:border-blue-500 focus:outline-none" />
              </div>
              <div className="flex gap-1.5">
                {['week','month','lastmonth'].map(p => (
                  <button key={p} onClick={() => setPeriodPreset(p)}
                    className="flex-1 py-1.5 rounded-lg text-[10px] font-semibold bg-gray-100 text-gray-500 hover:bg-gray-200">
                    {p === 'week' ? '今週' : p === 'month' ? '今月' : '先月'}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Summary Cards */}
          <div className="grid grid-cols-2 gap-2 mb-3">
            <div className="bg-white rounded-xl p-3 shadow-sm col-span-2">
              <div className="flex justify-between items-center">
                <p className="text-xs text-gray-500">売上合計</p>
                <p className="text-xs text-gray-400">
                  {mode === 'day'
                    ? `${summary.count}組 / ${summary.totalParty}名`
                    : `${summary.count}組 / ${summary.totalParty}名（${periodViewData.dailySummaries.length}日間）`}
                </p>
              </div>
              <p className="text-2xl font-bold text-green-600">¥{summary.total.toLocaleString()}</p>
            </div>
            <div className="bg-white rounded-xl p-3 shadow-sm">
              <p className="text-[10px] text-gray-500 mb-0.5">現金</p>
              <p className="text-base font-bold text-gray-700">¥{summary.cash.toLocaleString()}</p>
              <p className="text-[10px] text-gray-400">{summary.cashCount}組</p>
            </div>
            <div className="bg-white rounded-xl p-3 shadow-sm">
              <p className="text-[10px] text-gray-500 mb-0.5">カード</p>
              <p className="text-base font-bold text-blue-600">¥{summary.card.toLocaleString()}</p>
              <p className="text-[10px] text-gray-400">{summary.cardCount}組</p>
            </div>
            <div className="bg-white rounded-xl p-3 shadow-sm">
              <p className="text-[10px] text-gray-500 mb-0.5">QR</p>
              <p className="text-base font-bold text-purple-600">¥{summary.qr.toLocaleString()}</p>
              <p className="text-[10px] text-gray-400">{summary.qrCount}組</p>
            </div>
            <div className="bg-white rounded-xl p-3 shadow-sm">
              <p className="text-[10px] text-gray-500 mb-0.5">領収書</p>
              <p className="text-base font-bold text-orange-600">¥{summary.receipt.toLocaleString()}</p>
              <p className="text-[10px] text-gray-400">{summary.receiptCount}組</p>
            </div>
          </div>

          {/* Day Mode - Customer List */}
          {mode === 'day' && (
            <div className="bg-white rounded-xl shadow-sm overflow-hidden mb-4">
              <div className="bg-gray-50 px-3 py-2 border-b">
                <div className="grid grid-cols-12 text-[10px] font-semibold text-gray-400">
                  <div className="col-span-1">#</div>
                  <div className="col-span-1">人数</div>
                  <div className="col-span-3">名前</div>
                  <div className="col-span-3 text-right">売上</div>
                  <div className="col-span-2 text-center">支払</div>
                  <div className="col-span-2 text-center">領収書</div>
                </div>
              </div>
              <div>
                {dayViewData.records.length === 0 ? (
                  <div className="text-center text-gray-400 py-8 text-sm">この日のデータなし</div>
                ) : (() => {
                  let cum = 0;
                  return dayViewData.records.map((r, i) => {
                    cum += r.sales;
                    return (
                      <div key={i}>
                        <div onClick={() => toggleDetail(i)}
                          className={`cursor-pointer active:bg-gray-50 grid grid-cols-12 items-center px-3 py-2.5 ${r.receipt ? 'bg-orange-50' : ''}`}>
                          <div className="col-span-1 text-xs text-gray-400 font-medium">{i+1}</div>
                          <div className="col-span-1 text-xs text-gray-600">{r.party}</div>
                          <div className="col-span-3 text-sm font-medium text-gray-800 truncate">{r.name}</div>
                          <div className="col-span-3 text-right">
                            <p className="text-sm font-bold text-gray-800">¥{r.sales.toLocaleString()}</p>
                            <p className="text-[9px] text-gray-300">¥{cum.toLocaleString()}</p>
                          </div>
                          <div className={`col-span-2 text-center text-xs font-medium ${getPaymentClass(r.payment)}`}>{getPaymentText(r.payment)}</div>
                          <div className={`col-span-2 text-center text-xs ${r.receipt ? 'text-orange-600 font-semibold' : 'text-gray-300'}`}>{r.receipt ? '有' : '無'}</div>
                        </div>
                        {expandedRows.has(i) && <div className="bg-gray-50 border-t border-b border-gray-100">{renderItems(r.items)}</div>}
                      </div>
                    );
                  });
                })()}
              </div>
            </div>
          )}

          {/* Period Mode - Daily Summaries */}
          {mode === 'period' && (
            <div className="mb-4">
              {periodViewData.dailySummaries.length === 0 ? (
                <div className="text-center text-gray-400 py-8 text-sm bg-white rounded-xl shadow-sm">期間内のデータなし</div>
              ) : periodViewData.dailySummaries.map(ds => (
                <details key={ds.dateKey} className="bg-white rounded-xl shadow-sm mb-2 overflow-hidden">
                  <summary className="flex justify-between items-center px-3 py-2.5 bg-gray-50 border-b cursor-pointer list-none">
                    <div>
                      <span className="text-sm font-bold text-gray-800">{formatDateDisplay(ds.date)}</span>
                      <span className="text-xs text-gray-400 ml-2">{ds.summary.count}組</span>
                    </div>
                    <span className="text-sm font-bold text-green-600">¥{ds.summary.total.toLocaleString()}</span>
                  </summary>
                  <div>
                    <div className="flex gap-3 px-3 py-2 text-[10px] text-gray-400 border-b bg-gray-50 flex-wrap">
                      <span>現金 ¥{ds.summary.cash.toLocaleString()}({ds.summary.cashCount})</span>
                      <span>カード ¥{ds.summary.card.toLocaleString()}({ds.summary.cardCount})</span>
                      <span>QR ¥{ds.summary.qr.toLocaleString()}({ds.summary.qrCount})</span>
                      {ds.summary.receiptCount > 0 && <span>領収書 ¥{ds.summary.receipt.toLocaleString()}({ds.summary.receiptCount})</span>}
                    </div>
                    {ds.records.map((r, i) => (
                      <div key={i}>
                        <div onClick={() => togglePeriodDetail(ds.dateKey, i)}
                          className={`grid grid-cols-12 items-center px-3 py-2 cursor-pointer active:bg-gray-50 ${r.receipt ? 'bg-orange-50' : ''}`}>
                          <div className="col-span-1 text-xs text-gray-400">{i+1}</div>
                          <div className="col-span-1 text-xs text-gray-600">{r.party}</div>
                          <div className="col-span-3 text-sm font-medium text-gray-800 truncate">{r.name}</div>
                          <div className="col-span-3 text-right text-sm font-bold text-gray-800">¥{r.sales.toLocaleString()}</div>
                          <div className={`col-span-2 text-center text-xs font-medium ${getPaymentClass(r.payment)}`}>{getPaymentText(r.payment)}</div>
                          <div className={`col-span-2 text-center text-xs ${r.receipt ? 'text-orange-600 font-semibold' : 'text-gray-300'}`}>{r.receipt ? '有' : '無'}</div>
                        </div>
                        {expandedPeriodRows.has(`${ds.dateKey}-${i}`) && (
                          <div className="bg-gray-50 border-t border-gray-100">{renderItems(r.items)}</div>
                        )}
                      </div>
                    ))}
                  </div>
                </details>
              ))}
            </div>
          )}
        </div>
      );
    };

    // --- メイン DashboardPage（4タブ切替） ---

          {/* ダッシュボードタブ */}

    };

    // ============================================
    // スタッフ売上ページ（スタドリ）
    // ============================================
    const StaffSalesPage = ({ orders, users, onRefresh }) => {
      const [period, setPeriod] = useState('today'); // today, week, month, all

      // 期間フィルタリング
      const getFilteredOrders = () => {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        return orders.filter(o => {
          if (o.order_type !== 'staff_drink') return false;
          const orderDate = new Date(o.ordered_at);

          switch (period) {
            case 'today':
              return orderDate >= today;
            case 'week':
              const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
              return orderDate >= weekAgo;
            case 'month':
              const monthAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
              return orderDate >= monthAgo;
            default:
              return true;
          }
        });
      };

      // スタッフ別集計
      const getStaffStats = () => {
        const filtered = getFilteredOrders();
        const stats = {};

        filtered.forEach(o => {
          if (!o.staff_id) return;
          if (!stats[o.staff_id]) {
            stats[o.staff_id] = { count: 0, total: 0 };
          }
          stats[o.staff_id].count++;
          stats[o.staff_id].total += o.price;
        });

        // ソート（売上順）
        return Object.entries(stats)
          .map(([staffId, stat]) => ({
            staffId,
            staff: users.find(u => u.id === staffId),
            ...stat
          }))
          .sort((a, b) => b.total - a.total);
      };

      const staffStats = getStaffStats();
      const totalAmount = staffStats.reduce((sum, s) => sum + s.total, 0);
      const totalCount = staffStats.reduce((sum, s) => sum + s.count, 0);

      return (
        <div className="min-h-screen bg-gradient-to-b from-pink-100 to-white p-3 pb-24">
          <div className="flex justify-between items-center mb-3">
            <h1 className="text-xl font-bold">🥂 スタッフ売上</h1>
            <button onClick={onRefresh} className="text-xl p-1">🔄</button>
          </div>

          {/* 期間選択 */}
          <div className="flex gap-2 mb-4">
            {[
              { value: 'today', label: '今日' },
              { value: 'week', label: '今週' },
              { value: 'month', label: '今月' },
              { value: 'all', label: '全期間' },
            ].map(p => (
              <button key={p.value} onClick={() => setPeriod(p.value)}
                className={`flex-1 py-2 rounded-xl text-sm font-semibold transition-all ${
                  period === p.value
                    ? 'bg-pink-500 text-white'
                    : 'bg-white text-gray-600 border'
                }`}>
                {p.label}
              </button>
            ))}
          </div>

          {/* 合計 */}
          <div className="bg-pink-500 rounded-2xl p-6 mb-4 text-white shadow-lg">
            <div className="text-center">
              <p className="text-pink-200 text-sm">スタドリ合計</p>
              <p className="text-4xl font-bold">¥{totalAmount.toLocaleString()}</p>
              <p className="text-pink-200 text-sm mt-1">{totalCount}杯</p>
            </div>
          </div>

          {/* スタッフ別ランキング */}
          <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
            <div className="bg-pink-100 px-4 py-3">
              <h2 className="font-semibold text-pink-800">スタッフ別ランキング</h2>
            </div>
            <div className="divide-y">
              {staffStats.length > 0 ? (
                staffStats.map((stat, idx) => (
                  <div key={stat.staffId} className="flex items-center justify-between p-4">
                    <div className="flex items-center gap-3">
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-white ${
                        idx === 0 ? 'bg-yellow-500' :
                        idx === 1 ? 'bg-gray-400' :
                        idx === 2 ? 'bg-amber-600' : 'bg-gray-200 text-gray-600'
                      }`}>
                        {idx + 1}
                      </div>
                      <div>
                        <p className="font-semibold">{stat.staff?.name || '不明'}</p>
                        <p className="text-xs text-gray-500">{stat.count}杯</p>
                      </div>
                    </div>
                    <div className="text-right">
                      <p className="font-bold text-pink-600">¥{stat.total.toLocaleString()}</p>
                    </div>
                  </div>
                ))
              ) : (
                <div className="p-8 text-center text-gray-400">
                  <p>データがありません</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // 顧客一覧

    // ============================================
    // シフト管理画面
    // ============================================
    const ShiftPage = ({ users, shiftRequests, workingStaff, setWorkingStaff, onRefresh }) => {
      // === 状態管理 ===
      const [activeTab, setActiveTab] = useState('submit');
      const [currentMonth, setCurrentMonth] = useState(new Date().getMonth());
      const [currentYear, setCurrentYear] = useState(new Date().getFullYear());

      // 希望提出用
      const [selectedStaffId, setSelectedStaffId] = useState('');
      const [selectedDates, setSelectedDates] = useState(new Map()); // Map<dateStr, {start, end}>
      const [submitting, setSubmitting] = useState(false);

      // シフト確定用
      const [editedShifts, setEditedShifts] = useState({}); // {dateStr: {staffId: {checked, start, end}}}
      const [confirmedDates, setConfirmedDates] = useState(new Set());

      // === ユーティリティ関数 ===

      // 日付を "YYYY-MM-DD" 形式に正規化
      const toDateStr = (input) => {
        if (!input) return '';
        if (input instanceof Date) {
          return `${input.getFullYear()}-${String(input.getMonth() + 1).padStart(2, '0')}-${String(input.getDate()).padStart(2, '0')}`;
        }
        const str = String(input).split('T')[0];
        const [y, m, d] = str.split('-');
        return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
      };

      // 時間を "HH:MM" 形式に正規化（"18:00:00" → "18:00"）
      const toTimeStr = (input) => {
        if (!input) return '19:00';
        const parts = String(input).split(':');
        return `${parts[0].padStart(2, '0')}:${parts[1] || '00'}`;
      };

      // === 定数 ===
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayStr = toDateStr(today);

      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const firstDayOfWeek = new Date(currentYear, currentMonth, 1).getDay();

      const TIME_OPTIONS_START = ['18:00', '19:00', '20:00', '21:00', '22:00'];
      const TIME_OPTIONS_END = ['22:00', '23:00', '24:00', '25:00', '26:00', '27:00'];

      const staffList = users.filter(u => u.role === 'staff' || u.role === 'owner');

      // === データ取得ヘルパー ===
      const getStaffName = (staffId) => {
        const user = users.find(u => u.id === staffId);
        return user?.name || '不明';
      };

      const getRequestsForDate = (dateStr) => {
        return shiftRequests.filter(r => toDateStr(r.work_date) === dateStr);
      };

      // 深夜時間を24+形式に変換（01:00→25:00、02:00→26:00）
      const toDisplayTime = (timeStr, startTimeStr) => {
        const time = toTimeStr(timeStr);
        const [endHour] = time.split(':').map(Number);
        const [startHour] = toTimeStr(startTimeStr).split(':').map(Number);
        // 終了時間が開始時間より小さい場合は翌日（24+表示）
        if (endHour < startHour && endHour < 12) {
          return `${endHour + 24}:00`;
        }
        return time;
      };

      // リクエストから希望時間を取得（24+形式で表示）
      const getOriginalTime = (req) => {
        const start = toTimeStr(req.start_time);
        const end = toDisplayTime(req.end_time, req.start_time);
        return { start, end };
      };

      // 編集状態を取得（なければ希望時間をデフォルトに）
      const getShiftState = (dateStr, req) => {
        const edited = editedShifts[dateStr]?.[req.staff_id];
        if (edited) return edited;
        const orig = getOriginalTime(req);
        return { checked: true, start: orig.start, end: orig.end };
      };

      // === 希望提出タブの操作 ===
      const toggleDateSelection = (dateStr) => {
        setSelectedDates(prev => {
          const next = new Map(prev);
          if (next.has(dateStr)) {
            next.delete(dateStr);
          } else {
            next.set(dateStr, { start: '19:00', end: '24:00' });
          }
          return next;
        });
      };

      const updateSelectedTime = (dateStr, field, value) => {
        setSelectedDates(prev => {
          const next = new Map(prev);
          const current = next.get(dateStr) || { start: '19:00', end: '24:00' };
          next.set(dateStr, { ...current, [field]: value });
          return next;
        });
      };

      const removeSelectedDate = (dateStr) => {
        setSelectedDates(prev => {
          const next = new Map(prev);
          next.delete(dateStr);
          return next;
        });
      };

      // 24時を超える時間を有効なTIME形式に変換（25:00→01:00:00）
      const convertToValidTime = (timeStr) => {
        const [hours, minutes] = timeStr.split(':').map(Number);
        const validHours = hours >= 24 ? hours - 24 : hours;
        return `${String(validHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:00`;
      };

      const submitShiftRequest = async () => {
        if (!selectedStaffId) {
          alert('スタッフを選択してください');
          return;
        }
        if (selectedDates.size === 0) {
          alert('日付を選択してください');
          return;
        }

        console.log('[シフト送信] staff_id:', selectedStaffId);
        console.log('[シフト送信] 選択日数:', selectedDates.size);

        setSubmitting(true);
        try {
          for (const [dateStr, times] of selectedDates) {
            const payload = {
              staff_id: selectedStaffId,
              work_date: dateStr,
              start_time: convertToValidTime(times.start),
              end_time: convertToValidTime(times.end)
            };
            console.log('[シフト送信] payload:', payload);

            const { error } = await supabase.from('shift_requests').insert([payload]);
            if (error) {
              console.error('[シフト送信] エラー:', error);
              throw new Error(error);
            }
          }
          const staffName = getStaffName(selectedStaffId);
          alert(`${staffName}さんのシフト希望（${selectedDates.size}件）を送信しました！`);
          setSelectedDates(new Map());
          setSelectedStaffId('');
          onRefresh();
        } catch (err) {
          console.error('[シフト送信] 例外:', err);
          alert('送信エラー: ' + (err.message || String(err)));
        } finally {
          setSubmitting(false);
        }
      };

      // === シフト確定タブの操作 ===
      const toggleStaffCheck = (dateStr, staffId, req) => {
        const current = getShiftState(dateStr, req);
        setEditedShifts(prev => ({
          ...prev,
          [dateStr]: {
            ...prev[dateStr],
            [staffId]: { ...current, checked: !current.checked }
          }
        }));
      };

      const updateConfirmTime = (dateStr, staffId, req, field, value) => {
        const current = getShiftState(dateStr, req);
        setEditedShifts(prev => ({
          ...prev,
          [dateStr]: {
            ...prev[dateStr],
            [staffId]: { ...current, [field]: value }
          }
        }));
      };

      const confirmDay = (dateStr) => {
        const requests = getRequestsForDate(dateStr);
        const checkedStaffIds = requests
          .filter(req => getShiftState(dateStr, req).checked)
          .map(req => req.staff_id);

        setConfirmedDates(prev => new Set([...prev, dateStr]));

        if (dateStr === todayStr) {
          setWorkingStaff(checkedStaffIds);
          alert(`本日の出勤スタッフを${checkedStaffIds.length}名に設定しました`);
        } else {
          alert(`${formatDateFull(dateStr)}のシフトを確定しました（${checkedStaffIds.length}名）`);
        }
      };

      const deleteRequest = async (requestId) => {
        if (!confirm('この希望を削除しますか？')) return;
        await supabase.from('shift_requests').delete().eq('id', requestId);
        onRefresh();
      };

      // === 月ナビゲーション ===
      const prevMonth = () => {
        if (currentMonth === 0) {
          setCurrentMonth(11);
          setCurrentYear(y => y - 1);
        } else {
          setCurrentMonth(m => m - 1);
        }
      };

      const nextMonth = () => {
        if (currentMonth === 11) {
          setCurrentMonth(0);
          setCurrentYear(y => y + 1);
        } else {
          setCurrentMonth(m => m + 1);
        }
      };

      // === 希望がある日のリスト ===
      const datesWithRequests = [];
      for (let i = 1; i <= daysInMonth; i++) {
        const d = new Date(currentYear, currentMonth, i);
        const dateStr = toDateStr(d);
        const requests = getRequestsForDate(dateStr);
        if (requests.length > 0) {
          datesWithRequests.push({
            date: d,
            dateStr,
            requests,
            isPast: d < today
          });
        }
      }

      // === レンダリング ===
      return (
        <div className="min-h-screen bg-gray-100 p-3 pb-24">
          {/* ヘッダー */}
          <div className="flex justify-between items-center mb-3">
            <h1 className="text-xl font-bold">📅 シフト管理</h1>
            <button onClick={onRefresh} className="text-xl p-1">🔄</button>
          </div>

          {/* タブ切り替え */}
          <div className="flex gap-2 mb-3">
            <button onClick={() => setActiveTab('submit')}
              className={`flex-1 py-2 rounded-xl font-semibold text-sm ${activeTab === 'submit' ? 'bg-blue-500 text-white' : 'bg-white'}`}>
              希望提出
            </button>
            <button onClick={() => setActiveTab('confirm')}
              className={`flex-1 py-2 rounded-xl font-semibold text-sm ${activeTab === 'confirm' ? 'bg-green-500 text-white' : 'bg-white'}`}>
              シフト確定
            </button>
          </div>

          {activeTab === 'submit' ? (
            /* ========== 希望提出タブ ========== */
            <div className="bg-white rounded-xl p-4 shadow">
              {/* スタッフ選択 */}
              <div className="mb-4">
                <label className="block text-sm font-semibold mb-1">スタッフ</label>
                <select
                  value={selectedStaffId}
                  onChange={(e) => setSelectedStaffId(e.target.value)}
                  className="w-full border-2 border-gray-200 rounded-xl px-3 py-3 bg-white"
                >
                  <option value="">-- 選択してください --</option>
                  {staffList.map(staff => (
                    <option key={staff.id} value={staff.id}>{staff.name}</option>
                  ))}
                </select>
                {staffList.length === 0 && (
                  <p className="text-xs text-orange-500 mt-1">※ 設定画面でスタッフを登録してください</p>
                )}
              </div>

              {/* カレンダー */}
              <div className="mb-4">
                <div className="flex justify-between items-center mb-2">
                  <button onClick={prevMonth} className="p-2 rounded-full bg-gray-100">◀</button>
                  <span className="font-bold">{currentYear}年{currentMonth + 1}月</span>
                  <button onClick={nextMonth} className="p-2 rounded-full bg-gray-100">▶</button>
                </div>

                <div className="grid grid-cols-7 gap-1 text-center text-xs mb-1">
                  {['日', '月', '火', '水', '木', '金', '土'].map((d, i) => (
                    <div key={d} className={`py-1 font-semibold ${i === 0 ? 'text-red-500' : i === 6 ? 'text-blue-500' : ''}`}>{d}</div>
                  ))}
                </div>

                <div className="grid grid-cols-7 gap-1">
                  {Array(firstDayOfWeek).fill(null).map((_, i) => <div key={`empty-${i}`}></div>)}
                  {Array.from({ length: daysInMonth }, (_, i) => {
                    const day = i + 1;
                    const d = new Date(currentYear, currentMonth, day);
                    const dateStr = toDateStr(d);
                    const isPast = d < today;
                    const isSelected = selectedDates.has(dateStr);
                    const dow = d.getDay();
                    return (
                      <button
                        key={day}
                        onClick={() => !isPast && toggleDateSelection(dateStr)}
                        disabled={isPast}
                        className={`aspect-square rounded-lg flex items-center justify-center text-sm font-medium
                          ${isPast ? 'text-gray-300' : isSelected ? 'bg-blue-500 text-white' : 'bg-gray-100'}
                          ${!isPast && !isSelected && dow === 0 ? 'text-red-500' : ''}
                          ${!isPast && !isSelected && dow === 6 ? 'text-blue-500' : ''}`}
                      >
                        {day}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 選択した日付の時間設定 */}
              {selectedDates.size > 0 && (
                <div className="mb-4 bg-blue-50 rounded-xl p-3">
                  <p className="text-sm font-semibold text-blue-700 mb-3">🕐 勤務時間を設定（{selectedDates.size}件）</p>
                  <div className="space-y-2 max-h-48 overflow-y-auto">
                    {Array.from(selectedDates.entries())
                      .sort((a, b) => a[0].localeCompare(b[0]))
                      .map(([dateStr, times]) => (
                        <div key={dateStr} className="flex items-center gap-2 bg-white rounded-lg p-2">
                          <span className="text-sm font-medium min-w-[70px]">{formatDateFull(dateStr)}</span>
                          <select
                            value={times.start}
                            onChange={(e) => updateSelectedTime(dateStr, 'start', e.target.value)}
                            className="border rounded px-2 py-1 text-sm flex-1"
                          >
                            {TIME_OPTIONS_START.map(t => <option key={t} value={t}>{t}</option>)}
                          </select>
                          <span className="text-gray-400">〜</span>
                          <select
                            value={times.end}
                            onChange={(e) => updateSelectedTime(dateStr, 'end', e.target.value)}
                            className="border rounded px-2 py-1 text-sm flex-1"
                          >
                            {TIME_OPTIONS_END.map(t => <option key={t} value={t}>{t}</option>)}
                          </select>
                          <button onClick={() => removeSelectedDate(dateStr)} className="text-red-400 hover:text-red-600 px-1">✕</button>
                        </div>
                      ))}
                  </div>
                </div>
              )}

              {/* 送信ボタン */}
              <button
                onClick={submitShiftRequest}
                disabled={submitting || !selectedStaffId || selectedDates.size === 0}
                className="w-full py-3 rounded-xl bg-blue-500 text-white font-semibold disabled:opacity-50"
              >
                {submitting ? '送信中...' : 'シフト希望を送信'}
              </button>
            </div>
          ) : (
            /* ========== シフト確定タブ ========== */
            <div className="space-y-3">
              {/* 月ナビゲーション */}
              <div className="bg-white rounded-xl p-3 shadow">
                <div className="flex justify-between items-center">
                  <button onClick={prevMonth} className="p-2 rounded-full bg-gray-100">◀</button>
                  <span className="font-bold">{currentYear}年{currentMonth + 1}月</span>
                  <button onClick={nextMonth} className="p-2 rounded-full bg-gray-100">▶</button>
                </div>
              </div>

              {datesWithRequests.length === 0 ? (
                <div className="bg-white rounded-xl p-8 shadow text-center text-gray-400">
                  この月の希望はありません
                </div>
              ) : (
                datesWithRequests.map(({ date, dateStr, requests, isPast }) => {
                  const isToday = dateStr === todayStr;
                  const isConfirmed = confirmedDates.has(dateStr);

                  return (
                    <div key={dateStr} className={`bg-white rounded-xl shadow overflow-hidden ${isPast ? 'opacity-60' : ''}`}>
                      {/* 日付ヘッダー */}
                      <div className={`px-4 py-3 flex justify-between items-center ${isToday ? 'bg-green-50' : 'bg-gray-50'}`}>
                        <div>
                          <span className={`font-bold ${isToday ? 'text-green-700' : ''}`}>
                            {isToday && '📍 '}{formatDateFull(dateStr)}
                            <span className={`ml-1 ${date.getDay() === 0 ? 'text-red-500' : date.getDay() === 6 ? 'text-blue-500' : 'text-gray-400'}`}>
                              （{['日','月','火','水','木','金','土'][date.getDay()]}）
                            </span>
                          </span>
                          {isConfirmed && <span className="ml-2 text-green-600 text-sm">✓ 確定済み</span>}
                        </div>
                        {!isPast && (
                          <button
                            onClick={() => confirmDay(dateStr)}
                            className={`px-4 py-1 rounded-lg text-sm font-semibold text-white ${isToday ? 'bg-green-500' : 'bg-blue-500'}`}
                          >
                            {isConfirmed ? '再確定' : '確定'}
                          </button>
                        )}
                      </div>

                      {/* スタッフ一覧（コンパクト版） */}
                      <div className="divide-y">
                        {requests.map(req => {
                          const state = getShiftState(dateStr, req);
                          const orig = getOriginalTime(req);
                          const isChanged = state.start !== orig.start || state.end !== orig.end;

                          // ドロップダウンオプション（希望時間を含む）
                          const startOpts = TIME_OPTIONS_START.includes(orig.start)
                            ? TIME_OPTIONS_START
                            : [...TIME_OPTIONS_START, orig.start].sort();
                          const endOpts = TIME_OPTIONS_END.includes(orig.end)
                            ? TIME_OPTIONS_END
                            : [...TIME_OPTIONS_END, orig.end].sort();

                          return (
                            <div key={req.id} className={`px-4 py-3 flex items-center gap-2 flex-wrap ${isPast ? 'pointer-events-none' : ''}`}>
                              <input
                                type="checkbox"
                                checked={state.checked}
                                onChange={() => toggleStaffCheck(dateStr, req.staff_id, req)}
                                className="w-4 h-4 rounded"
                                disabled={isPast}
                              />
                              <span className={`font-medium text-sm min-w-[60px] ${state.checked ? '' : 'text-gray-400'}`}>
                                {getStaffName(req.staff_id)}
                              </span>
                              <span className="text-gray-400 text-xs">
                                希望 {orig.start}-{orig.end}
                              </span>
                              <span className="text-gray-300">→</span>
                              <select
                                value={state.start}
                                onChange={(e) => updateConfirmTime(dateStr, req.staff_id, req, 'start', e.target.value)}
                                className={`border rounded px-1 py-0.5 text-xs ${isChanged ? 'border-orange-400 bg-orange-50' : ''}`}
                                disabled={isPast}
                              >
                                {startOpts.map(t => <option key={t} value={t}>{t}</option>)}
                              </select>
                              <span className="text-gray-400 text-xs">-</span>
                              <select
                                value={state.end}
                                onChange={(e) => updateConfirmTime(dateStr, req.staff_id, req, 'end', e.target.value)}
                                className={`border rounded px-1 py-0.5 text-xs ${isChanged ? 'border-orange-400 bg-orange-50' : ''}`}
                                disabled={isPast}
                              >
                                {endOpts.map(t => <option key={t} value={t}>{t}</option>)}
                              </select>
                              {isChanged && <span className="text-orange-500 text-xs font-medium">変更</span>}
                              <button
                                onClick={() => deleteRequest(req.id)}
                                className="text-red-300 hover:text-red-500 text-xs ml-auto"
                                disabled={isPast}
                              >
                                削除
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}
        </div>
      );
    };

    // ============================================
    // メニュー管理コンポーネント
    // ============================================
    const MenuManager = ({ menuItems, onRefresh }) => {
      const [showEditor, setShowEditor] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [newName, setNewName] = useState('');
      const [newPrice, setNewPrice] = useState('');
      const [newCategory, setNewCategory] = useState('ドリンク');
      const [saving, setSaving] = useState(false);
      const [importing, setImporting] = useState(false);

      const categories = ['ドリンク', 'フード', 'ボトル', 'その他'];

      // CSVインポート処理
      const handleCSVImport = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setImporting(true);
        try {
          const text = await file.text();
          const lines = text.split('\n').filter(line => line.trim());

          // ヘッダー行をスキップ（最初の行が「名前」「商品名」等を含む場合）
          const startIdx = lines[0].includes('名前') || lines[0].includes('商品') || lines[0].includes('name') ? 1 : 0;

          let imported = 0;
          for (let i = startIdx; i < lines.length; i++) {
            const parts = lines[i].split(',').map(p => p.trim().replace(/"/g, ''));
            if (parts.length >= 2) {
              const name = parts[0];
              const price = parseInt(parts[1].replace(/[¥,]/g, ''));
              const category = parts[2] || 'ドリンク';

              if (name && !isNaN(price)) {
                await supabase.from('menu_items').insert([{
                  name,
                  price,
                  category: categories.includes(category) ? category : 'その他',
                  is_active: true,
                  display_order: menuItems.length + imported + 1
                }]);
                imported++;
              }
            }
          }

          alert(`${imported}件のメニューをインポートしました`);
          onRefresh();
        } catch (err) {
          alert('インポートに失敗しました: ' + err.message);
        } finally {
          setImporting(false);
          e.target.value = ''; // 同じファイルを再選択可能に
        }
      };

      const handleAddItem = async () => {
        if (!newName.trim() || !newPrice) { alert('名前と価格を入力してください'); return; }
        setSaving(true);
        await supabase.from('menu_items').insert([{
          name: newName.trim(),
          price: parseInt(newPrice),
          category: newCategory,
          is_active: true,
          display_order: menuItems.length + 1
        }]);
        setNewName('');
        setNewPrice('');
        setSaving(false);
        onRefresh();
      };

      const handleUpdateItem = async (item, updates) => {
        setSaving(true);
        await supabase.from('menu_items').update(updates).eq('id', item.id);
        setSaving(false);
        setEditingItem(null);
        onRefresh();
      };

      const handleDeleteItem = async (item) => {
        if (!confirm(`「${item.name}」を削除しますか？`)) return;
        await supabase.from('menu_items').delete().eq('id', item.id);
        onRefresh();
      };

      const handleToggleActive = async (item) => {
        await supabase.from('menu_items').update({ is_active: !item.is_active }).eq('id', item.id);
        onRefresh();
      };

      // カテゴリ別にグループ化
      const groupedItems = menuItems.reduce((acc, item) => {
        const cat = item.category || 'その他';
        if (!acc[cat]) acc[cat] = [];
        acc[cat].push(item);
        return acc;
      }, {});

      return (
        <div className="bg-white rounded-xl p-4 shadow mb-3">
          <div className="flex justify-between items-center mb-3">
            <h2 className="font-semibold text-sm">📋 クイックメニュー ({menuItems.filter(m => m.is_active).length}件)</h2>
            <div className="flex gap-2">
              <label className="px-3 py-1 bg-green-500 text-white rounded-lg text-sm cursor-pointer">
                {importing ? '読込中...' : 'CSV'}
                <input type="file" accept=".csv,.txt" onChange={handleCSVImport} className="hidden" disabled={importing} />
              </label>
              <button onClick={() => setShowEditor(!showEditor)}
                className="px-3 py-1 bg-blue-500 text-white rounded-lg text-sm">
                {showEditor ? '閉じる' : '編集'}
              </button>
            </div>
          </div>

          {!showEditor ? (
            <div className="flex flex-wrap gap-1">
              {menuItems.filter(m => m.is_active).map(m => (
                <span key={m.id} className="px-2 py-1 bg-gray-100 rounded-full text-xs">
                  {m.name} ¥{m.price}
                </span>
              ))}
              {menuItems.filter(m => m.is_active).length === 0 && (
                <p className="text-gray-400 text-sm">メニューがありません</p>
              )}
            </div>
          ) : (
            <div className="space-y-4">
              {/* 新規追加フォーム */}
              <div className="bg-green-50 rounded-xl p-3">
                <p className="text-sm font-semibold text-green-700 mb-2">➕ 新規追加</p>
                <div className="flex gap-2 mb-2">
                  <input type="text" value={newName} onChange={(e) => setNewName(e.target.value)}
                    className="flex-1 border-2 border-gray-200 rounded-lg px-3 py-2 text-sm" placeholder="商品名" />
                  <input type="number" value={newPrice} onChange={(e) => setNewPrice(e.target.value)}
                    className="w-24 border-2 border-gray-200 rounded-lg px-3 py-2 text-sm" placeholder="価格" />
                </div>
                <div className="flex gap-2">
                  <select value={newCategory} onChange={(e) => setNewCategory(e.target.value)}
                    className="flex-1 border-2 border-gray-200 rounded-lg px-3 py-2 text-sm">
                    {categories.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <button onClick={handleAddItem} disabled={saving || !newName.trim() || !newPrice}
                    className="px-4 py-2 bg-green-500 text-white rounded-lg text-sm font-semibold disabled:opacity-50">
                    追加
                  </button>
                </div>
              </div>

              {/* カテゴリ別メニューリスト */}
              {categories.map(category => {
                const items = groupedItems[category] || [];
                if (items.length === 0) return null;
                return (
                  <div key={category}>
                    <p className="text-xs font-semibold text-gray-500 mb-1">{category}</p>
