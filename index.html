<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SHUFF v7.3</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1e293b; }
    input, select, textarea { font-size: 16px; }
    /* モバイルタッチ改善：300ms遅延を無効化 */
    button, a, [role="button"] {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ============================================
    // Supabase設定（デモ用プロジェクト）
    // ============================================
    const SUPABASE_URL = 'https://jvgvnarwegqtqgpmhgdk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_u4o0lNeGwiWM9OOABA6GjA_T8S336uk';

    // Supabaseクライアント
    const supabase = {
      from: (table) => {
        const query = `${SUPABASE_URL}/rest/v1/${table}`;
        const headers = {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
        };
        return {
          select: (columns = '*') => {
            let filters = [];
            let isSingle = false;
            const builder = {
              eq: (column, value) => {
                filters.push(`${column}=eq.${value}`);
                return builder;
              },
              single: () => {
                isSingle = true;
                return builder;
              },
              then: async (resolve, reject) => {
                try {
                  const filterStr = filters.length > 0 ? `&${filters.join('&')}` : '';
                  const res = await fetch(`${query}?select=${columns}${filterStr}`, { headers });
                  if (!res.ok) throw new Error(`HTTP ${res.status}`);
                  const data = await res.json();
                  if (isSingle) {
                    resolve({ data: Array.isArray(data) && data.length > 0 ? data[0] : null, error: null });
                  } else {
                    resolve({ data: Array.isArray(data) ? data : [], error: null });
                  }
                } catch (err) {
                  resolve({ data: isSingle ? null : [], error: err.message });
                }
              }
            };
            return builder;
          },
          insert: async (rows) => {
            try {
              console.log('[INSERT]', table, rows);
              const res = await fetch(query, {
                method: 'POST',
                headers: { ...headers, 'Prefer': 'return=representation' },
                body: JSON.stringify(rows),
              });
              if (!res.ok) {
                const errorText = await res.text();
                console.error('[INSERT ERROR]', res.status, errorText);
                throw new Error(`HTTP ${res.status}: ${errorText}`);
              }
              const data = await res.json();
              return { data: Array.isArray(data) ? data : [], error: null };
            } catch (err) {
              return { data: [], error: err.message };
            }
          },
          update: (updates) => ({
            eq: async (column, value) => {
              try {
                const res = await fetch(`${query}?${column}=eq.${value}`, {
                  method: 'PATCH',
                  headers: { ...headers, 'Prefer': 'return=representation' },
                  body: JSON.stringify(updates),
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                return { data: Array.isArray(data) ? data : [], error: null };
              } catch (err) {
                return { data: [], error: err.message };
              }
            },
          }),
          delete: () => ({
            eq: async (column, value) => {
              try {
                const res = await fetch(`${query}?${column}=eq.${value}`, { method: 'DELETE', headers });
                return { error: res.ok ? null : 'Delete failed' };
              } catch (err) {
                return { error: err.message };
              }
            },
          }),
          upsert: async (rows) => {
            try {
              const res = await fetch(query, {
                method: 'POST',
                headers: { ...headers, 'Prefer': 'return=representation,resolution=merge-duplicates' },
                body: JSON.stringify(rows),
              });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const data = await res.json();
              return { data: Array.isArray(data) ? data : [], error: null };
            } catch (err) {
              return { data: [], error: err.message };
            }
          },
        };
      },
    };

    // ============================================
    // ユーティリティ
    // ============================================
    const getStatusColor = (status) => {
      switch (status) {
        case 'VIP': return 'bg-yellow-500';
        case '常連': return 'bg-blue-500';
        case '新規': return 'bg-green-500';
        default: return 'bg-gray-500';
      }
    };

    const getStatusBgLight = (status) => {
      switch (status) {
        case 'VIP': return 'bg-yellow-100 border-yellow-400';
        case '常連': return 'bg-blue-100 border-blue-400';
        case '新規': return 'bg-green-100 border-green-400';
        default: return 'bg-gray-100 border-gray-400';
      }
    };

    const formatTime = (dateString) => {
      if (!dateString) return '-';
      return new Date(dateString).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    };

    const formatDateFull = (dateString) => {
      if (!dateString) return '-';
      const d = new Date(dateString);
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
    };

    // ============================================
    // ナビゲーションバー
    // ============================================
    const NavBar = ({ currentPage, onNavigate }) => {
      const tabs = [
        { id: 'floor', icon: '🪑', label: 'フロア' },
        { id: 'dashboard', icon: '📊', label: '売上' },
        { id: 'staff', icon: '🥂', label: 'スタドリ' },
        { id: 'shift', icon: '📅', label: 'シフト' },
        { id: 'customers', icon: '👥', label: '顧客' },
        { id: 'settings', icon: '⚙️', label: '設定' },
      ];
      return (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-40">
          <div className="flex">
            {tabs.map(tab => (
              <button key={tab.id} onClick={() => onNavigate(tab.id)}
                className={`flex-1 py-2 text-center transition-colors flex flex-col items-center
                  ${currentPage === tab.id ? 'text-blue-600 bg-blue-50' : 'text-gray-500'}`}>
                <span className="text-lg">{tab.icon}</span>
                <span className="text-xs">{tab.label}</span>
              </button>
            ))}
          </div>
        </div>
      );
    };

    // チャージ計算（¥880/時間/人）- 着席した時点で1時間分発生
    const CHARGE_PER_HOUR = 880;
    const calculateCharge = (seatedAt, partySize = 1, currentTime = Date.now()) => {
      if (!seatedAt) return 0;
      const minutes = (currentTime - new Date(seatedAt).getTime()) / 60000;
      const hours = Math.floor(minutes / 60) + 1; // 0分=1時間分、61分=2時間分
      return hours * CHARGE_PER_HOUR * partySize;
    };

    // ============================================
    // カウンター席コンポーネント（金額表示付き・グループ対応）
    // ============================================
    const CounterSeat = ({ seat, customer, visit, seatTotal, groupTotal, isPrimary, primarySeatId, groupColor, onSelect, currentTime }) => {
      // currentTimeが変わると再レンダリングされ、経過時間が再計算される
      const duration = visit?.seated_at ? Math.floor((currentTime - new Date(visit.seated_at).getTime()) / 60000) : 0;

      // グループ色のボーダー設定
      const groupBorderColors = {
        purple: 'ring-4 ring-purple-400',
        pink: 'ring-4 ring-pink-400',
        cyan: 'ring-4 ring-cyan-400',
        orange: 'ring-4 ring-orange-400',
        lime: 'ring-4 ring-lime-400',
        amber: 'ring-4 ring-amber-400',
        teal: 'ring-4 ring-teal-400',
        rose: 'ring-4 ring-rose-400',
      };

      return (
        <button onClick={() => onSelect(seat)}
          className={`w-14 h-14 rounded-full flex flex-col items-center justify-center transition-all duration-200 border-2 shadow-sm
            ${groupColor ? groupBorderColors[groupColor] : ''}
            ${seat.occupied
              ? `${customer ? getStatusBgLight(customer.status) : 'bg-orange-100 border-orange-400'} active:scale-95`
              : 'bg-gray-100 border-gray-300 active:scale-95 active:bg-gray-200'}`}>
          <span className={`text-xs font-bold ${seat.occupied ? 'text-gray-700' : 'text-gray-400'}`}>
            {seat.id.replace('C', '')}
          </span>
          {seat.occupied && (
            <>
              <span className="text-[8px] text-gray-500">{duration}分</span>
              {isPrimary ? (
                <span className="text-[8px] font-bold text-green-600">¥{groupTotal.toLocaleString()}</span>
              ) : (
                <span className="text-[8px] text-gray-400">→{primarySeatId?.replace('C', '')}</span>
              )}
            </>
          )}
        </button>
      );
    };

    // ============================================
    // テーブル席コンポーネント（金額表示付き・グループ対応）
    // ============================================
    const TableSeat = ({ seat, customer, visit, seatTotal, groupTotal, isPrimary, primarySeatId, groupColor, onSelect, currentTime }) => {
      // currentTimeが変わると再レンダリングされ、経過時間が再計算される
      const duration = visit?.seated_at ? Math.floor((currentTime - new Date(visit.seated_at).getTime()) / 60000) : 0;
      const partySize = visit?.party_size || 1;

      // グループ色のボーダー設定
      const groupBorderColors = {
        purple: 'ring-4 ring-purple-400',
        pink: 'ring-4 ring-pink-400',
        cyan: 'ring-4 ring-cyan-400',
        orange: 'ring-4 ring-orange-400',
        lime: 'ring-4 ring-lime-400',
        amber: 'ring-4 ring-amber-400',
        teal: 'ring-4 ring-teal-400',
        rose: 'ring-4 ring-rose-400',
      };

      return (
        <button onClick={() => onSelect(seat)}
          className={`w-28 h-24 rounded-xl flex flex-col items-center justify-center transition-all duration-200 border-2 shadow-md
            ${groupColor ? groupBorderColors[groupColor] : ''}
            ${seat.occupied
              ? `${customer ? getStatusBgLight(customer.status) : 'bg-orange-100 border-orange-400'} active:scale-95`
              : 'bg-gray-100 border-gray-300 active:scale-95 active:bg-gray-200'}`}>
          <span className={`text-sm font-bold ${seat.occupied ? 'text-gray-700' : 'text-gray-400'}`}>
            {seat.id}
          </span>
          {seat.occupied ? (
            <>
              {customer && <span className="text-xs text-gray-600 truncate w-full px-1 text-center">{customer.name.substring(0,4)}</span>}
              <div className="flex items-center gap-1 text-[10px] text-gray-500">
                <span>{partySize}名</span>
                <span>{duration}分</span>
              </div>
              {isPrimary ? (
                <span className="text-xs font-bold text-green-600">¥{groupTotal.toLocaleString()}</span>
              ) : (
                <span className="text-xs text-gray-400">→{primarySeatId}</span>
              )}
            </>
          ) : (
            <span className="text-xs text-gray-400">空席</span>
          )}
        </button>
      );
    };

    // ============================================
    // 顧客オートコンプリート
    // ============================================
    const CustomerAutocomplete = ({ customers, onSelect, onCreateNew }) => {
      const [search, setSearch] = useState('');
      const [showSuggestions, setShowSuggestions] = useState(false);

      const filtered = useMemo(() => {
        if (!search.trim()) return [];
        const s = search.toLowerCase();
        return customers.filter(c =>
          c.name.toLowerCase().includes(s) ||
          (c.name_kana && c.name_kana.toLowerCase().includes(s)) ||
          (c.favorite && c.favorite.toLowerCase().includes(s)) ||
          (c.appearance && c.appearance.toLowerCase().includes(s))
        ).slice(0, 5);
      }, [search, customers]);

      return (
        <div className="relative">
          <input type="text" value={search}
            onChange={(e) => { setSearch(e.target.value); setShowSuggestions(true); }}
            onFocus={() => setShowSuggestions(true)}
            className="w-full border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500"
            placeholder="名前・特徴で検索..." />
          {showSuggestions && search && (
            <div className="absolute top-full left-0 right-0 bg-white border rounded-xl shadow-lg mt-1 z-50 max-h-60 overflow-y-auto">
              {filtered.map(customer => (
                <button key={customer.id}
                  onClick={() => { onSelect(customer); setSearch(''); setShowSuggestions(false); }}
                  className="w-full text-left p-3 hover:bg-gray-50 active:bg-gray-100 border-b last:border-0">
                  <div className="flex justify-between items-center">
                    <div>
                      <div className="font-semibold">{customer.name}</div>
                      <div className="text-xs text-gray-500">{customer.appearance || customer.favorite || '情報なし'}</div>
                    </div>
                    <span className={`px-2 py-1 rounded-full text-xs text-white ${getStatusColor(customer.status)}`}>{customer.status}</span>
                  </div>
                </button>
              ))}
              {filtered.length === 0 && <div className="p-3 text-center text-gray-500">該当なし</div>}
              <button onClick={() => { onCreateNew(search); setShowSuggestions(false); }}
                className="w-full p-3 text-center text-green-600 font-semibold hover:bg-green-50 border-t">
                ＋「{search}」を新規登録
              </button>
            </div>
          )}
        </div>
      );
    };

    // ============================================
    // 来店予測（曜日パターン）
    // ============================================
    const getVisitPrediction = (customer) => {
      const today = new Date().getDay(); // 0=日, 1=月, ...
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      const pattern = customer.visit_pattern || {};
      const todayCount = pattern[today] || 0;
      const totalVisits = customer.total_visits || 0;
      if (totalVisits < 2) return null;
      const probability = totalVisits > 0 ? Math.round((todayCount / totalVisits) * 100) : 0;
      if (probability >= 30) return { prob: probability, day: dayNames[today], high: true };
      if (probability >= 15) return { prob: probability, day: dayNames[today], high: false };
      return null;
    };

    // ============================================
    // 新規顧客登録モーダル（常連優先・性別追加・複数席対応）
    // ============================================
    const NewCustomerModal = ({ seat, initialName, customers, allSeats, onClose, onSave, onSelectExisting }) => {
      const [mode, setMode] = useState('select'); // 'select', 'new'
      const [customerTab, setCustomerTab] = useState('regular'); // 'regular'（常連）, 'free'（フリー）

      // フリー客用のダミー名を生成（西暦付き）
      const generateDummyName = () => {
        const now = new Date();
        const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;
        const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
        return `${seat.id} (${dateStr} ${timeStr})`;
      };
      const [selectedCustomer, setSelectedCustomer] = useState(null);
      const [name, setName] = useState(initialName || '');
      const [nameKana, setNameKana] = useState('');
      const [gender, setGender] = useState('');
      const [status, setStatus] = useState('新規');
      const [appearance, setAppearance] = useState('');
      const [ageRange, setAgeRange] = useState('');
      const [favorite, setFavorite] = useState('');
      const [notes, setNotes] = useState('');
      const [partySize, setPartySize] = useState('1');
      const [selectedSeats, setSelectedSeats] = useState([seat.id]); // 複数席選択
      const [saving, setSaving] = useState(false);
      const [searchText, setSearchText] = useState('');

      const isTable = seat.seat_type && seat.seat_type !== 'counter';
      const isCounter = !isTable;

      // 全てのカウンター席（C1〜C8の順番で表示）
      const allCounterSeats = allSeats ? allSeats
        .filter(s => s.seat_type === 'counter')
        .sort((a, b) => {
          const numA = parseInt(a.id.replace('C', ''));
          const numB = parseInt(b.id.replace('C', ''));
          return numA - numB;
        }) : [];
      const ageOptions = ['', '10代', '20代前半', '20代後半', '30代前半', '30代後半', '40代', '50代', '60代以上'];
      const genderOptions = ['', '男性', '女性', 'その他'];

      // 顧客ソート：直近来店者優先 → 利用金額順で補完
      const sortedCustomers = useMemo(() => {
        // 来店履歴がある顧客（直近順）
        const withVisit = customers
          .filter(c => c.last_visit_at)
          .sort((a, b) => new Date(b.last_visit_at) - new Date(a.last_visit_at));

        // 来店履歴がない顧客（利用金額順）
        const withoutVisit = customers
          .filter(c => !c.last_visit_at)
          .sort((a, b) => (b.total_spent || 0) - (a.total_spent || 0));

        // 来店履歴あり → 来店履歴なし の順で結合
        return [...withVisit, ...withoutVisit];
      }, [customers]);

      // 検索フィルタ
      const filteredCustomers = useMemo(() => {
        // 検索テキストがない場合：上位10人を表示
        if (!searchText.trim()) {
          return sortedCustomers.slice(0, 10);
        }
        // 検索テキストがある場合：全顧客から検索
        const s = searchText.toLowerCase();
        return customers.filter(c =>
          c.name.toLowerCase().includes(s) ||
          (c.name_kana && c.name_kana.toLowerCase().includes(s)) ||
          (c.favorite && c.favorite.toLowerCase().includes(s)) ||
          (c.appearance && c.appearance.toLowerCase().includes(s))
        ).slice(0, 20); // 検索時は20件まで表示
      }, [sortedCustomers, customers, searchText]);

      // 人数変更時に席選択をリセット
      const handlePartySizeChange = (size) => {
        setPartySize(size);
        if (isCounter && parseInt(size) > 1) {
          // カウンターで2名以上の場合、最初の席だけ選択状態に
          setSelectedSeats([seat.id]);
        }
      };

      // 席の選択切り替え
      const toggleSeatSelection = (seatId) => {
        const ps = parseInt(partySize) || 1;
        if (selectedSeats.includes(seatId)) {
          // 最初の席（タップした席）は外せない
          if (seatId === seat.id) return;
          setSelectedSeats(selectedSeats.filter(id => id !== seatId));
        } else {
          if (selectedSeats.length < ps) {
            setSelectedSeats([...selectedSeats, seatId]);
          }
        }
      };

      // 新規顧客として登録して着席
      const handleSaveNew = async () => {
        if (!name.trim()) { alert('名前を入力してください'); return; }
        const ps = parseInt(partySize) || 1;
        if (isCounter && ps > 1 && selectedSeats.length !== ps) {
          alert(`${ps}名の場合、${ps}席を選択してください`);
          return;
        }
        setSaving(true);
        await onSave({
          name,
          name_kana: nameKana,
          gender,
          status,
          appearance,
          age_range: ageRange,
          favorite,
          notes
        }, selectedSeats, ps);
        setSaving(false);
      };

      // 既存顧客を着席
      const handleSeatExisting = async () => {
        if (!selectedCustomer) return;
        const ps = parseInt(partySize) || 1;
        if (isCounter && ps > 1 && selectedSeats.length !== ps) {
          alert(`${ps}名の場合、${ps}席を選択してください`);
          return;
        }
        setSaving(true);
        await onSelectExisting(selectedCustomer, selectedSeats, ps);
        setSaving(false);
      };

      // 既存顧客を選択
      const handleSelectCustomer = (customer) => {
        setSelectedCustomer(customer);
      };

      // フリー客として着席（フォーム入力値を使用）
      const handleSeatFree = async () => {
        if (!name.trim()) { alert('名前を入力してください'); return; }
        const ps = parseInt(partySize) || 1;
        if (isCounter && ps > 1 && selectedSeats.length !== ps) {
          alert(`${ps}名の場合、${ps}席を選択してください`);
          return;
        }
        setSaving(true);
        await onSave({
          name,
          name_kana: nameKana,
          gender,
          status,
          appearance,
          age_range: ageRange,
          favorite,
          notes
        }, selectedSeats, ps);
        setSaving(false);
      };

      // フリータブに切り替えたときにダミー名をセット
      const handleTabChange = (tab) => {
        setCustomerTab(tab);
        if (tab === 'free') {
          setName(generateDummyName());
          // 他のフィールドをリセット
          setNameKana('');
          setGender('');
          setStatus('新規');
          setAppearance('');
          setAgeRange('');
          setFavorite('');
          setNotes('');
        } else {
          // 常連タブに戻る時はリセット
          setName(initialName || '');
        }
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl p-5 w-full max-w-md max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold">👤 {seat.id} に着席</h2>
              <button onClick={onClose} className="text-gray-400 text-2xl">&times;</button>
            </div>

            {/* 人数入力（常に表示） */}
            <div className="mb-4 bg-blue-50 p-3 rounded-xl">
              <label className="block text-sm font-semibold text-blue-700 mb-2">👥 来店人数</label>
              <div className="flex gap-2 flex-wrap">
                {[1,2,3,4,5,6,7,8].map(n => (
                  <button key={n} onClick={() => handlePartySizeChange(n.toString())}
                    className={`w-10 h-10 rounded-full font-bold ${partySize === n.toString() ? 'bg-blue-500 text-white' : 'bg-white border-2 border-gray-300'}`}>
                    {n}
                  </button>
                ))}
              </div>
            </div>

            {/* カウンター席で2名以上の場合、席選択 */}
            {isCounter && parseInt(partySize) > 1 && (
              <div className="mb-4 bg-amber-50 p-3 rounded-xl">
                <label className="block text-sm font-semibold text-amber-700 mb-2">

                  {allCounterSeats.map(s => {

                      <button

            {mode === 'select' ? (

                ) : (

                  <div className="space-y-3">
                    <div className="bg-green-50 border-2 border-green-200 rounded-xl p-2 text-center mb-2">
                      <p className="text-green-700 text-sm">🆓 フリー客 - 後から情報を編集できます</p>

                      <div>

                        <select value={gender} onChange={(e) => setGender(e.target.value)}
                          className="w-full border-2 border-gray-200 rounded-xl px-2 py-2">

                      <div>

                        <select value={status} onChange={(e) => setStatus(e.target.value)}

                          className="w-full border-2 border-gray-200 rounded-xl px-2 py-2">

                    <div>

                    <div>

                      <input type="text" value={favorite} onChange={(e) => setFavorite(e.target.value)}

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-1">メモ</label>

                    </div>
                    <div className="flex gap-3 mt-3">
                      <button onClick={onClose} className="flex-1 py-3 rounded-xl border-2 border-gray-300 font-semibold">
                        キャンセル
                      </button>
                      <button onClick={handleSeatFree} disabled={saving || !name.trim() || (isCounter && parseInt(partySize) > 1 && selectedSeats.length !== parseInt(partySize))}
                        className="flex-1 py-3 rounded-xl bg-green-500 text-white font-semibold disabled:opacity-50">
                        {saving ? '処理中...' : `フリーで着席（${partySize}名）`}
                      </button>
                    </div>
                  </div>
                )}
              </>
            ) : (
              <>
                {/* 新規登録フォーム */}
                <div className="space-y-3">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">名前 *</label>
                    <input type="text" value={name} onChange={(e) => setName(e.target.value)}
                      className="w-full border-2 border-gray-200 rounded-xl px-3 py-2" placeholder="山田 太郎" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">ふりがな</label>
                    <input type="text" value={nameKana} onChange={(e) => setNameKana(e.target.value)}
                      className="w-full border-2 border-gray-200 rounded-xl px-3 py-2" placeholder="やまだ たろう" />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-1">性別</label>
                      <select value={gender} onChange={(e) => setGender(e.target.value)}
                        className="w-full border-2 border-gray-200 rounded-xl px-2 py-2">
                        {genderOptions.map(g => <option key={g} value={g}>{g || '選択'}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-1">ステータス</label>
                      <select value={status} onChange={(e) => setStatus(e.target.value)}
                        className="w-full border-2 border-gray-200 rounded-xl px-2 py-2">
                        <option value="新規">新規</option>
                        <option value="常連">常連</option>
                        <option value="VIP">VIP</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-1">年代</label>
                      <select value={ageRange} onChange={(e) => setAgeRange(e.target.value)}
                        className="w-full border-2 border-gray-200 rounded-xl px-2 py-2">
                        {ageOptions.map(a => <option key={a} value={a}>{a || '選択'}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">見た目・特徴</label>
                    <input type="text" value={appearance} onChange={(e) => setAppearance(e.target.value)}
                      className="w-full border-2 border-gray-200 rounded-xl px-3 py-2" placeholder="メガネ、長髪..." />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">好みのドリンク</label>
                    <input type="text" value={favorite} onChange={(e) => setFavorite(e.target.value)}
                      className="w-full border-2 border-gray-200 rounded-xl px-3 py-2" placeholder="ハイボール薄め" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">メモ</label>
                    <textarea value={notes} onChange={(e) => setNotes(e.target.value)}
                      className="w-full border-2 border-gray-200 rounded-xl px-3 py-2" rows={2} placeholder="話題、注意点" />
                  </div>
                </div>

                <div className="flex gap-3 mt-5">
                  <button onClick={() => setMode('select')} className="flex-1 py-3 rounded-xl border-2 border-gray-300 font-semibold">
                    戻る
                  </button>
                  <button onClick={handleSaveNew} disabled={saving || !name.trim()}
                    className="flex-1 py-3 rounded-xl bg-blue-500 text-white font-semibold disabled:opacity-50">
                    {saving ? '登録中...' : `登録して着席（${partySize}名）`}
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    };

    // ============================================
    // 注文追加モーダル（選択式・スタッフドリンク対応）
    // ============================================
    const AddOrderModal = ({ customer, seatId, visitId, menuItems, users, workingStaff, onClose, onSave, existingOrders }) => {
      const availableStaff = workingStaff && workingStaff.length > 0
        ? users.filter(u => workingStaff.includes(u.id))
        : users;
      const [orderType, setOrderType] = useState('customer');
      const [saving, setSaving] = useState(false);
      // 統合カート: [{id, type:'customer'|'staff', name, price, quantity, staffId?, staffName?, staffDrinkType?, menuId?}]
      const [cart, setCart] = useState([]);
      const [showCart, setShowCart] = useState(false);
      // スタッフドリンク設定
      const [staffId, setStaffId] = useState('');
      const [staffDrinkType, setStaffDrinkType] = useState('normal');

      const CATEGORY_ORDER = ['ウィスキー', 'カクテル', '焼酎', 'ビール', 'ワイン', 'シャンパン', 'ショット', 'ソフトドリンク', 'フード', 'キープボトル'];
      const COCKTAIL_SUBS = ['ウォッカ', 'ジン', 'テキーラ', 'ラム', 'その他'];
      const [activeCategory, setActiveCategory] = useState('ウィスキー');
      const [activeCocktailSub, setActiveCocktailSub] = useState('ウォッカ');

      const groupedMenu = useMemo(() => {
        return menuItems.filter(m => m.is_active).reduce((acc, item) => {
          const cat = item.category || 'その他';
          if (!acc[cat]) acc[cat] = [];
          acc[cat].push(item);
          return acc;
        }, {});
      }, [menuItems]);

      const currentItems = useMemo(() => {
        const items = groupedMenu[activeCategory] || [];
        if (activeCategory === 'カクテル') return items.filter(m => m.subcategory === activeCocktailSub);
        return items.sort((a, b) => (a.display_order || 0) - (b.display_order || 0));
      }, [groupedMenu, activeCategory, activeCocktailSub]);

      // 直近注文（セッション内 or 履歴）- 最大3件
      const recentItems = useMemo(() => {
        if (!existingOrders || existingOrders.length === 0) return [];
        const seen = new Set();
        return existingOrders
          .filter(o => o.order_type === 'customer' && o.item)
          .reverse()
          .filter(o => { if (seen.has(o.item)) return false; seen.add(o.item); return true; })
          .slice(0, 3)
          .map(o => ({ name: o.item, price: o.price, menuId: menuItems.find(m => m.name === o.item)?.id }));
      }, [existingOrders, menuItems]);

      const catIcon = (cat) => {
        const icons = { 'ウィスキー': '🥃', 'カクテル': '🍸', '焼酎': '🍶', 'ビール': '🍺', 'ワイン': '🍷', 'シャンパン': '🥂', 'ショット': '🔥', 'ソフトドリンク': '🥤', 'フード': '🍽️', 'キープボトル': '🍾' };
        return icons[cat] || '📦';
      };

      // カート集計
      const cartTotal = useMemo(() => cart.reduce((s, c) => s + c.price * c.quantity, 0), [cart]);
      const cartCount = useMemo(() => cart.reduce((s, c) => s + c.quantity, 0), [cart]);
      const customerItems = useMemo(() => cart.filter(c => c.type === 'customer'), [cart]);
      const staffItems = useMemo(() => cart.filter(c => c.type === 'staff'), [cart]);

      // お客様注文追加
      const addCustomerItem = (menuItem) => {
        const key = 'c_' + menuItem.id;
        setCart(prev => {
          const ex = prev.find(c => c.id === key);
          if (ex) return prev.map(c => c.id === key ? { ...c, quantity: c.quantity + 1 } : c);
          return [...prev, { id: key, type: 'customer', name: menuItem.name, price: menuItem.price, quantity: 1, menuId: menuItem.id }];
        });
      };
      const addCustomerByName = (name, price) => {
        const mi = menuItems.find(m => m.name === name);
        if (mi) { addCustomerItem(mi); return; }
        const key = 'cc_' + name;
        setCart(prev => {
          const ex = prev.find(c => c.id === key);
          if (ex) return prev.map(c => c.id === key ? { ...c, quantity: c.quantity + 1 } : c);
          return [...prev, { id: key, type: 'customer', name, price, quantity: 1 }];
        });
      };
      const getCustomerQty = (menuId) => { const c = cart.find(c => c.id === 'c_' + menuId); return c ? c.quantity : 0; };

      // スタドリ追加（通常/ボトルキープ）
      const addStaffDrink = (type) => {
        const sId = staffId;
        const sName = availableStaff.find(u => u.id === sId)?.name || '未選択';
        const name = type === 'normal' ? 'スタドリ（通常）' : 'スタドリ（ボトルキープ）';
        const price = type === 'normal' ? 1000 : 500;
        const key = 's_' + type + '_' + sId;
        setCart(prev => {
          const ex = prev.find(c => c.id === key);
          if (ex) return prev.map(c => c.id === key ? { ...c, quantity: c.quantity + 1 } : c);
          return [...prev, { id: key, type: 'staff', name, price, quantity: 1, staffId: sId, staffName: sName, staffDrinkType: type }];
        });
      };
      // スタドリ高額
      const addStaffPremium = (menuItem) => {
        const sId = staffId;
        const sName = availableStaff.find(u => u.id === sId)?.name || '未選択';
        const key = 'sp_' + menuItem.id + '_' + sId;
        setCart(prev => {
          const ex = prev.find(c => c.id === key);
          if (ex) return prev.map(c => c.id === key ? { ...c, quantity: c.quantity + 1 } : c);
          return [...prev, { id: key, type: 'staff', name: menuItem.name, price: menuItem.price, quantity: 1, staffId: sId, staffName: sName, staffDrinkType: 'premium', menuId: menuItem.id }];
        });
      };
      const getStaffPremiumQty = (menuId) => { const c = cart.find(c => c.id === 'sp_' + menuId + '_' + staffId); return c ? c.quantity : 0; };

      const updateQuantity = (cartId, delta) => {
        setCart(prev => prev.map(c => { if (c.id === cartId) { const nq = c.quantity + delta; return nq > 0 ? { ...c, quantity: nq } : null; } return c; }).filter(Boolean));
      };
      const removeFromCart = (cartId) => setCart(prev => prev.filter(c => c.id !== cartId));

      // まとめて追加
      const handleSubmit = async () => {
        if (cart.length === 0) return;
        setSaving(true);
        for (const c of cart) {
          for (let i = 0; i < c.quantity; i++) {
            await onSave({
              customer_id: customer.id, seat_id: seatId, visit_id: visitId,
              item: c.name, price: c.price,
              order_type: c.type === 'staff' ? 'staff_drink' : 'customer',
              staff_id: c.staffId || null,
            });
          }
        }
        setSaving(false);
        setCart([]);
        setShowCart(false);
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-2 z-50">
          <div className="bg-white rounded-2xl w-full max-w-lg max-h-[92vh] flex flex-col">
            <div className="flex justify-between items-center p-4 pb-2">
              <div>
                <h2 className="text-xl font-bold">📝 注文追加</h2>
                <p className="text-gray-500 text-sm">{customer.name}さん</p>
              </div>
              <button onClick={onClose} className="text-gray-400 text-2xl">&times;</button>
            </div>

            <div className="flex gap-2 px-4 mb-3">
              <button onClick={() => setOrderType('customer')}
                className={`flex-1 py-2 rounded-xl font-semibold text-sm ${orderType === 'customer' ? 'bg-blue-500 text-white' : 'bg-gray-100'}`}>
                🍺 お客様注文
              </button>
              <button onClick={() => setOrderType('staff_drink')}
                className={`flex-1 py-2 rounded-xl font-semibold text-sm ${orderType === 'staff_drink' ? 'bg-pink-500 text-white' : 'bg-gray-100'}`}>
                🥂 スタッフドリンク
              </button>
            </div>

            <div className="flex-1 overflow-y-auto px-4">
              {orderType === 'customer' ? (
                <>
                  {/* 直近注文チップ */}
                  {recentItems.length > 0 && (
                    <div className="mb-3 p-2.5 bg-green-50 border border-green-200 rounded-xl">
                      <p className="text-xs font-semibold text-green-800 mb-2">直近の注文</p>
                      <div className="flex flex-wrap gap-1.5">
                        {recentItems.map((r, i) => (
                          <button key={i} onClick={() => addCustomerByName(r.name, r.price)}
                            className="bg-white border border-green-200 text-xs font-medium py-1.5 px-2.5 rounded-full active:bg-green-100 transition-colors">
                            {r.name} ¥{r.price.toLocaleString()}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="flex gap-1.5 overflow-x-auto pb-2 mb-3 -mx-1 px-1" style={{WebkitOverflowScrolling: 'touch', scrollbarWidth: 'none'}}>
                    {CATEGORY_ORDER.filter(cat => groupedMenu[cat]?.length > 0).map(cat => (
                      <button key={cat} onClick={() => { setActiveCategory(cat); if (cat === 'カクテル') setActiveCocktailSub('ウォッカ'); }}
                        className={`flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all
                          ${activeCategory === cat ? 'bg-blue-500 text-white shadow-sm' : 'bg-gray-100 text-gray-600'}`}>
                        {catIcon(cat)} {cat}
                      </button>
                    ))}
                  </div>

                  {activeCategory === 'カクテル' && (
                    <div className="flex gap-1.5 overflow-x-auto pb-2 mb-3" style={{WebkitOverflowScrolling: 'touch', scrollbarWidth: 'none'}}>
                      {COCKTAIL_SUBS.map(sub => {
                        const hasItems = (groupedMenu['カクテル'] || []).some(m => m.subcategory === sub);
                        if (!hasItems) return null;
                        return (
                          <button key={sub} onClick={() => setActiveCocktailSub(sub)}
                            className={`flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all
                              ${activeCocktailSub === sub ? 'bg-indigo-500 text-white shadow-sm' : 'bg-indigo-50 text-indigo-600'}`}>
                            {sub}
                          </button>
                        );
                      })}
                    </div>
                  )}

                  <div className="space-y-1.5 mb-3">
                    {currentItems.map(m => {
                      const qty = getCustomerQty(m.id);
                      return (
                        <button key={m.id} onClick={() => addCustomerItem(m)}

      if (!data) return null;

      const { customerOrderTotal, chargeTotal, staffDrinkTotal, grandTotal, partySize, chargeHours } = data;
      const discount = Math.max(0, Math.min(grandTotal, parseInt(discountInput) || 0));
      const paymentAmount = grandTotal - discount;

      const handleDiscountFocus = () => {
        setEditingField('discount');
        setDiscountInput(discount === 0 ? '' : String(discount));
      };
      const handleDiscountBlur = () => {
        setEditingField(null);
        const num = Math.max(0, Math.min(grandTotal, parseInt(discountInput) || 0));
        setDiscountInput(String(num));
      };
      const handleDiscountChange = (val) => {
        setDiscountInput(val.replace(/[^0-9]/g, ''));
      };

      const handlePaymentFocus = () => {
        setEditingField('payment');
        setPaymentInput(paymentAmount === 0 ? '' : String(paymentAmount));
      };
      const handlePaymentBlur = () => {
        setEditingField(null);
        const num = Math.max(0, Math.min(grandTotal, parseInt(paymentInput) || 0));
        setDiscountInput(String(grandTotal - num));

      const handlePaymentChange = (val) => {
        setPaymentInput(val.replace(/[^0-9]/g, ''));

              <div className="flex justify-between text-lg">

                  value={editingField === 'discount' ? discountInput : `¥${discount.toLocaleString()}`}
                  onFocus={handleDiscountFocus} onBlur={handleDiscountBlur}
                  onChange={(e) => handleDiscountChange(e.target.value)}

    const FloorMapPage = ({ seats, customers, orders, visits, users, onSelectSeat, onRefresh, currentTime, businessDay }) => {
      // currentTimeはAppから受け取る（10秒ごとに更新される）

      // 席をタイプ別に分類
      const counterSeats = seats.filter(s => s.seat_type === 'counter').sort((a, b) => a.display_order - b.display_order);
      const tableSeats = seats.filter(s => s.seat_type && s.seat_type !== 'counter').sort((a, b) => a.display_order - b.display_order);

      const occupiedCount = seats.filter(s => s.occupied).length;

      // 今日の売上（内訳付き）
      // 営業日のopened_at以降の注文を「今日の売上」とする（24時超え対応）
      const todayOrders = orders.filter(o => {
        if (businessDay?.opened_at) {
          return new Date(o.ordered_at) >= new Date(businessDay.opened_at);
        }
        return new Date(o.ordered_at).toDateString() === new Date().toDateString();
      });
      const todayCustomerTotal = todayOrders.filter(o => !o.order_type || o.order_type === 'customer').reduce((sum, o) => sum + o.price, 0);
      const todayChargeTotal = todayOrders.filter(o => o.order_type === 'charge').reduce((sum, o) => sum + o.price, 0);
      const todayStaffDrinkTotal = todayOrders.filter(o => o.order_type === 'staff_drink').reduce((sum, o) => sum + o.price, 0);

      const todayTotal = todayCustomerTotal + todayChargeTotal + todayStaffDrinkTotal;

      const getCustomer = (seat) => seat.customer_id ? customers.find(c => c.id === seat.customer_id) : null;
      const getVisit = (seat) => seat.visit_id ? visits.find(v => v.id === seat.visit_id) : null;

      // 代表席かどうか判定（visitのseat_idが代表席）
      const isPrimarySeat = (seat) => {
        if (!seat.visit_id) return false;
        const visit = visits.find(v => v.id === seat.visit_id);
        return visit?.seat_id === seat.id;
      };

      // 代表席のIDを取得
      const getPrimarySeatId = (seat) => {
        if (!seat.visit_id) return null;
        const visit = visits.find(v => v.id === seat.visit_id);
        return visit?.seat_id || null;
      };

      // 同じグループの席を取得
      const getGroupSeats = (seat) => {
        if (!seat.visit_id) return [];
        return seats.filter(s => s.visit_id === seat.visit_id);
      };

      // グループの色（visit_idからハッシュで色を決定）
      const groupColors = ['purple', 'pink', 'cyan', 'orange', 'lime', 'amber', 'teal', 'rose'];
      const getGroupColor = (seat) => {
        if (!seat.visit_id) return null;
        const groupSeats = getGroupSeats(seat);
        if (groupSeats.length <= 1) return null; // 1人なら色なし
        // visit_idから色を決定
        const hash = seat.visit_id.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
        return groupColors[hash % groupColors.length];
      };

      // 席ごとの合計（代表席のみに表示、連れ席は0）
      const getSeatTotal = (seat) => {
        const visit = visits.find(v => v.id === seat.visit_id);
        if (!visit) return 0;
        // 代表席でない場合は0を返す（表示用）
        if (visit.seat_id !== seat.id) return 0;
        return orders.filter(o => o.visit_id === visit.id).reduce((sum, o) => sum + o.price, 0);
      };

      // グループ全体の合計を取得（どの席からでも）
      const getGroupTotal = (seat) => {
        const visit = visits.find(v => v.id === seat.visit_id);
        if (!visit) return 0;
        return orders.filter(o => o.visit_id === visit.id).reduce((sum, o) => sum + o.price, 0);
      };

      return (
        <div className="min-h-screen bg-gradient-to-b from-slate-900 to-slate-800 p-3 pb-24">

                <p className="text-gray-500 text-xs">
                  {new Date().getMonth() + 1}月{new Date().getDate()}日（{['日','月','火','水','木','金','土'][new Date().getDay()]}）営業中

                <div className="text-right">
                  <p className="text-xl font-bold text-blue-600">{occupiedCount}<span className="text-sm text-gray-400">/{seats.length}</span></p>
                  <p className="text-lg font-bold text-green-600">¥{todayTotal.toLocaleString()}</p>
                </div>
              </div>
            </div>
            {/* 売上内訳 */}
            <div className="flex justify-end gap-3 mt-2 text-xs text-gray-500">
              <span>注文 ¥{todayCustomerTotal.toLocaleString()}</span>
              <span>チャージ ¥{todayChargeTotal.toLocaleString()}</span>
              <span className="text-pink-500">スタドリ ¥{todayStaffDrinkTotal.toLocaleString()}</span>

          {/* 凡例 */}
          <div className="bg-white rounded-xl p-2 mb-3 shadow">
            <div className="flex justify-around text-xs">
              <div className="flex items-center gap-1"><div className="w-3 h-3 rounded bg-yellow-100 border border-yellow-400"></div><span>VIP</span></div>

            </div>

          {/* カウンターエリア */}
          <div className="bg-white rounded-2xl p-4 mb-3 shadow-lg">

                    visit={getVisit(seat)}

          {/* テーブルエリア */}

                    return (

                      </div>

            );
          })()}
        </div>
      );
    };

    // ============================================
    // 顧客詳細画面（席選択時）
    // ============================================
    const CustomerDetailPage = ({ customer, seat, visit, orders, onBack, onAddOrder, onEdit, onCheckout, onRefresh, currentTime, onDeleteOrder }) => {

            <div className="flex justify-end gap-3 mt-1 text-sm text-green-100">
              <span>注文 ¥{customerOrderTotal.toLocaleString()}</span>
              <span>チャージ ¥{chargeTotal.toLocaleString()}</span>
              {staffDrinkTotal > 0 && <span>スタドリ ¥{staffDrinkTotal.toLocaleString()}</span>}
            </div>

          {(customer.favorite || customer.appearance || customer.notes) && (

              {customer.appearance && <p className="text-xs bg-purple-50 p-2 rounded mb-2"><span className="font-semibold">特徴:</span> {customer.appearance}</p>}
              {customer.favorite && <p className="text-xs bg-yellow-50 p-2 rounded mb-2"><span className="font-semibold">好み:</span> {customer.favorite}</p>}
              {customer.notes && <p className="text-xs bg-gray-50 p-2 rounded"><span className="font-semibold">メモ:</span> {customer.notes}</p>}
            </div>
          )}

          <div className="bg-white rounded-2xl p-4 mb-3 shadow-lg">
            <div className="flex justify-between items-center mb-3">
              <h2 className="font-semibold text-sm">📝 注文履歴</h2>
              <span className="text-xs text-amber-600 bg-amber-50 px-2 py-1 rounded">⏱️ チャージ自動追加</span>
            </div>
            {visitOrders.length > 0 ? (
              <div className="space-y-1.5 max-h-48 overflow-y-auto">
                {visitOrders.map((o, i) => (
                  <div key={o.id || i} className={`flex justify-between items-center text-sm border-b pb-1 ${o.order_type === 'staff_drink' ? 'text-pink-600' : o.order_type === 'charge' ? 'text-amber-600' : ''}`}>
                    <span className="flex-1">
                      <span className="text-gray-400 mr-2 text-xs">{formatTime(o.ordered_at)}</span>
                      {o.item}
                      {o.order_type === 'staff_drink' && <span className="ml-1 text-xs">🥂</span>}
                      {o.order_type === 'charge' && <span className="ml-1 text-xs">⏱️</span>}
                    </span>
                    <span className="font-semibold mr-2">¥{o.price.toLocaleString()}</span>
                    <button

                          onDeleteOrder(o.id);

                      className="text-red-400 hover:text-red-600 text-xs px-1"
                    >
                      ✕

            ) : <p className="text-gray-400 text-center py-2 text-sm">注文なし</p>}
            <button onClick={onAddOrder} className="w-full mt-3 bg-blue-500 text-white py-2.5 rounded-xl font-semibold active:bg-blue-600">
              ＋ 注文追加
            </button>

          <div className="grid grid-cols-2 gap-3">

            <button onClick={onCheckout} className="bg-orange-500 text-white py-3 rounded-xl font-semibold active:bg-orange-600">🚪 会計 ¥{grandTotal.toLocaleString()}</button>
          </div>

      );
    };

    // ============================================
    // ダッシュボード（売上） - v7.0: 3タブ構成
    // ============================================

    // --- サブタブ①: 今日の売上 ---
    const DashboardToday = ({ orders, visits, customers, businessDay }) => {
      const today = new Date();
      const todayOrders = orders.filter(o => {
        if (businessDay?.opened_at) {
          return new Date(o.ordered_at) >= new Date(businessDay.opened_at);
        }
        return new Date(o.ordered_at).toDateString() === today.toDateString();
      });
      const todayTotal = todayOrders.reduce((sum, o) => sum + o.price, 0);
      const todayCustomers = new Set(todayOrders.map(o => o.customer_id)).size;

      const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
      const weekOrders = orders.filter(o => new Date(o.ordered_at) >= weekAgo);
      const weekTotal = weekOrders.reduce((sum, o) => sum + o.price, 0);

      const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
      const monthOrders = orders.filter(o => new Date(o.ordered_at) >= monthStart);
      const monthTotal = monthOrders.reduce((sum, o) => sum + o.price, 0);

      const customerTotals = {};
      orders.forEach(o => { customerTotals[o.customer_id] = (customerTotals[o.customer_id] || 0) + o.price; });
      const ranking = Object.entries(customerTotals)
        .map(([id, total]) => ({ customer: customers.find(c => c.id === id), total }))
        .filter(r => r.customer)
        .sort((a, b) => b.total - a.total)
        .slice(0, 10);

      return (
        <>
          <div className="grid grid-cols-3 gap-2 mb-3">
            <div className="bg-white rounded-xl p-3 shadow text-center">
              <p className="text-xs text-gray-500">本日</p>

              <p className="text-xs text-gray-500">今月</p>
              <p className="text-lg font-bold text-purple-600">¥{monthTotal.toLocaleString()}</p>

            <h2 className="font-semibold mb-3 text-sm">🏆 顧客ランキング（累計）</h2>
            {ranking.length > 0 ? ranking.map((r, i) => (

                  <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
                    ${i === 0 ? 'bg-yellow-400 text-white' : i === 1 ? 'bg-gray-400 text-white' : i === 2 ? 'bg-orange-400 text-white' : 'bg-gray-200'}`}>
                    {i + 1}
                  </span>
                  <span className="text-sm font-medium">{r.customer.name}</span>
                </div>
                <span className="font-bold text-green-600 text-sm">¥{r.total.toLocaleString()}</span>

          </div>
        </>
